<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faith International School, Itobe — Portal</title>

<!-- ============================================================
  FAITH INTERNATIONAL SCHOOL, ITOBE — SCHOOL PORTAL
  Single-file HTML + Firebase (Auth + Firestore)
  Structure:
    1. General Admin  -> oversees BOTH Primary and Secondary
    2. Primary Admin   -> manages Primary level only
    3. Secondary Admin -> manages Secondary level only
    4. Teacher / Student / Cashier -> routed to their level

  FIRESTORE SCHEMA (create these collections):
    users/{uid}          { name, role, level, email }
        role: "general_admin" | "primary_admin" | "secondary_admin"
              | "teacher" | "student" | "cashier"
        level: "primary" | "secondary" | "both"  (General Admin = "both")

    students/{id}        { name, level, class, admissionNo, ... }
    teachers/{id}         { name, level, subjects, classes, ... }
    results/{id}          { studentId, level, subject, ca1, ca2, exam, term, session }
    fees/{id}              { studentId, level, amountPaid, balance, term }
    announcements/{id}   { title, body, level, date }  level:"both" = all
  ============================================================ -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root{
    --maroon:#6B0F1A;
    --maroon-dark:#4d0a13;
    --black:#111111;
    --white:#ffffff;
    --gray-bg:#f4f2f0;
    --gray-line:#e2ddd8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--gray-bg);
    color: var(--black);
    min-height:100vh;
  }
  /* subtle horseback-check motif strip */
  .check-strip{
    height:8px;
    width:100%;
    background: repeating-linear-gradient(45deg, var(--maroon) 0 10px, var(--black) 10px 20px);
  }
  .hidden{ display:none !important; }

  /* ---------- LOGIN SCREEN ---------- */
  #loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: linear-gradient(180deg, var(--white) 0%, var(--gray-bg) 100%);
    padding:20px;
  }
  .login-card{
    background:var(--white);
    border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,0.12);
    max-width:380px;
    width:100%;
    overflow:hidden;
    border:1px solid var(--gray-line);
  }
  .login-header{
    background:var(--maroon);
    color:var(--white);
    text-align:center;
    padding:28px 20px 20px;
  }
  .crest{
    width:64px; height:64px;
    margin:0 auto 10px;
  }
  .login-header h1{
    font-size:18px;
    letter-spacing:0.5px;
  }
  .login-header p{
    font-size:12px;
    opacity:0.9;
    margin-top:4px;
    font-style:italic;
  }
  .login-body{ padding:24px 24px 28px; }
  .login-body label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin:14px 0 6px;
    color:var(--black);
  }
  .login-body input{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--gray-line);
    border-radius:8px;
    font-size:15px;
  }
  .login-body input:focus{
    outline:none;
    border-color:var(--maroon);
  }
  #loginBtn{
    width:100%;
    margin-top:20px;
    padding:12px;
    background:var(--maroon);
    color:var(--white);
    border:none;
    border-radius:8px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  #loginBtn:active{ background:var(--maroon-dark); }
  #loginError{
    color:var(--maroon);
    font-size:13px;
    margin-top:12px;
    text-align:center;
    min-height:16px;
  }
  .login-footer{
    text-align:center;
    font-size:11px;
    color:#888;
    padding:14px;
    border-top:1px solid var(--gray-line);
  }

  /* ---------- APP SHELL ---------- */
  #appShell{ min-height:100vh; }
  header.topbar{
    background:var(--maroon);
    color:var(--white);
    padding:14px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
  }
  .topbar-left{ display:flex; align-items:center; gap:10px; }
  .topbar-left .crest-sm{ width:34px; height:34px; }
  .topbar-left h2{ font-size:15px; line-height:1.2; }
  .topbar-left span{ display:block; font-size:11px; opacity:0.85; font-style:italic; }
  .badge{
    background:rgba(255,255,255,0.15);
    padding:4px 10px;
    border-radius:20px;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.3px;
  }
  #logoutBtn{
    background:var(--white);
    color:var(--maroon);
    border:none;
    padding:8px 14px;
    border-radius:6px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }

  .level-switch{
    display:flex;
    gap:8px;
    padding:12px 18px;
    background:var(--white);
    border-bottom:1px solid var(--gray-line);
  }
  .level-switch button{
    flex:1;
    padding:10px;
    border:1px solid var(--gray-line);
    background:var(--gray-bg);
    border-radius:8px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    color:var(--black);
  }
  .level-switch button.active{
    background:var(--maroon);
    color:var(--white);
    border-color:var(--maroon);
  }

  main{ padding:18px; max-width:900px; margin:0 auto; }
  .section-title{
    font-size:16px;
    font-weight:700;
    color:var(--maroon);
    margin:20px 0 10px;
    padding-bottom:6px;
    border-bottom:2px solid var(--maroon);
  }
  .section-title:first-child{ margin-top:0; }

  .card-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px,1fr));
    gap:12px;
  }
  .tile{
    background:var(--white);
    border:1px solid var(--gray-line);
    border-radius:10px;
    padding:16px 12px;
    text-align:center;
    cursor:pointer;
    transition:transform 0.1s;
  }
  .tile:active{ transform:scale(0.97); background:var(--gray-bg); }
  .tile .icon{ font-size:26px; margin-bottom:8px; }
  .tile .label{ font-size:12.5px; font-weight:600; color:var(--black); }

  .stat-row{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(110px,1fr));
    gap:10px;
    margin-bottom:16px;
  }
  .stat-box{
    background:var(--white);
    border:1px solid var(--gray-line);
    border-left:4px solid var(--maroon);
    border-radius:8px;
    padding:12px 14px;
  }
  .stat-box .num{ font-size:22px; font-weight:700; color:var(--maroon); }
  .stat-box .lbl{ font-size:11.5px; color:#555; margin-top:2px; }

  .placeholder-note{
    background:#fff8e6;
    border:1px solid #f0d98c;
    color:#7a5c00;
    font-size:12.5px;
    padding:10px 12px;
    border-radius:8px;
    margin-top:10px;
  }

  footer.foot{
    text-align:center;
    font-size:11px;
    color:#999;
    padding:24px 10px 30px;
  }
</style>
</head>
<body>

<!-- ================= LOGIN SCREEN ================= -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-header">
      <svg class="crest" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 4 L56 14 V30 C56 46 46 56 32 60 C18 56 8 46 8 30 V14 Z" fill="#ffffff" opacity="0.15"/>
        <path d="M32 4 L56 14 V30 C56 46 46 56 32 60 C18 56 8 46 8 30 V14 Z" stroke="#ffffff" stroke-width="2"/>
        <path d="M32 16 L32 44 M20 30 L44 30" stroke="#ffffff" stroke-width="2.5"/>
      </svg>
      <h1>FAITH INTERNATIONAL SCHOOL, ITOBE</h1>
      <p>"In God We Trust"</p>
    </div>
    <div class="login-body">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@fiss.edu.ng" autocomplete="username">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      <button id="loginBtn" onclick="handleLogin()">Log In</button>
      <div id="loginError"></div>
    </div>
    <div class="login-footer">Nursery · Primary · Secondary</div>
  </div>
</div>

<!-- ================= APP SHELL ================= -->
<div id="appShell" class="hidden">
  <div class="check-strip"></div>
  <header class="topbar">
    <div class="topbar-left">
      <svg class="crest-sm" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 4 L56 14 V30 C56 46 46 56 32 60 C18 56 8 46 8 30 V14 Z" fill="#ffffff" opacity="0.15"/>
        <path d="M32 4 L56 14 V30 C56 46 46 56 32 60 C18 56 8 46 8 30 V14 Z" stroke="#ffffff" stroke-width="2"/>
        <path d="M32 16 L32 44 M20 30 L44 30" stroke="#ffffff" stroke-width="2.5"/>
      </svg>
      <div>
        <h2>Faith International School, Itobe</h2>
        <span id="userRoleLabel">—</span>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <span class="badge" id="userNameBadge">—</span>
      <button id="logoutBtn" onclick="handleLogout()">Log Out</button>
    </div>
  </header>

  <!-- Level switch — visible ONLY to General Admin -->
  <div class="level-switch hidden" id="levelSwitch">
    <button id="btnPrimaryView" onclick="setGeneralAdminView('primary')">Primary View</button>
    <button id="btnSecondaryView" onclick="setGeneralAdminView('secondary')">Secondary View</button>
    <button id="btnOverviewView" onclick="setGeneralAdminView('overview')">Overview (Both)</button>
  </div>

  <main id="mainContent">
    <!-- Dashboards are rendered here by JS based on role -->
  </main>

  <footer class="foot">Faith International School, Itobe — Portal · In God We Trust</footer>
</div>

<script>
/* ============================================================
   FIREBASE CONFIG
   Replace with your own Firebase project keys before deploying.
   Create a SEPARATE Firebase project from FISSI Connect.
============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyBhSTNPcF8jd9XJ_J2cPCuedbaAYp58X5I",
  authDomain: "fiss-itobe-portal.firebaseapp.com",
  projectId: "fiss-itobe-portal",
  storageBucket: "fiss-itobe-portal.firebasestorage.app",
  messagingSenderId: "655933896387",
  appId: "1:655933896387:web:9e6df2097afc1948469476"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;   // Firebase auth user
let currentProfile = null; // Firestore users/{uid} doc: {name, role, level}
let generalAdminView = "overview"; // "primary" | "secondary" | "overview"

/* ---------------- LOGIN / LOGOUT ---------------- */
function handleLogin(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const errBox = document.getElementById("loginError");
  errBox.textContent = "";

  if(!email || !password){
    errBox.textContent = "Please enter both email and password.";
    return;
  }

  document.getElementById("loginBtn").textContent = "Logging in...";

  auth.signInWithEmailAndPassword(email, password)
    .then(() => {
      alert("DEBUG: Sign-in succeeded. Now loading profile...");
    })
    .catch(err => {
      alert("DEBUG: Sign-in FAILED: " + err.code + " — " + err.message);
      errBox.textContent = "Login failed: " + err.message;
      document.getElementById("loginBtn").textContent = "Log In";
    });
}

function handleLogout(){
  auth.signOut();
}

auth.onAuthStateChanged(async (user) => {
  if(user){
    currentUser = user;
    await loadUserProfile(user.uid);
  } else {
    currentUser = null;
    currentProfile = null;
    document.getElementById("loginScreen").classList.remove("hidden");
    document.getElementById("appShell").classList.add("hidden");
    document.getElementById("loginBtn").textContent = "Log In";
  }
});

async function loadUserProfile(uid){
  try{
    alert("DEBUG: Fetching profile for UID: " + uid);
    const doc = await db.collection("users").doc(uid).get();
    alert("DEBUG: Fetch complete. Exists? " + doc.exists);
    if(!doc.exists){
      document.getElementById("loginError").textContent =
        "No profile found for this account. Contact General Admin.";
      auth.signOut();
      return;
    }
    currentProfile = doc.data(); // { name, role, level, email }
    alert("DEBUG: Profile loaded. Role = " + currentProfile.role);
    enterPortal();
  } catch(e){
    alert("DEBUG: Firestore ERROR: " + e.code + " — " + e.message);
    document.getElementById("loginError").textContent = "Error loading profile: " + e.message;
    document.getElementById("loginBtn").textContent = "Log In";
  }
}

/* ---------------- ROUTING ---------------- */
function enterPortal(){
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("appShell").classList.remove("hidden");

  document.getElementById("userNameBadge").textContent = currentProfile.name || currentUser.email;
  document.getElementById("userRoleLabel").textContent = roleLabel(currentProfile.role);

  const levelSwitch = document.getElementById("levelSwitch");
  if(currentProfile.role === "general_admin"){
    levelSwitch.classList.remove("hidden");
    generalAdminView = "overview";
    highlightViewButton();
  } else {
    levelSwitch.classList.add("hidden");
  }

  renderDashboard();
}

function roleLabel(role){
  return {
    general_admin: "General Admin — Oversees Primary & Secondary",
    primary_admin: "Primary Admin",
    secondary_admin: "Secondary Admin",
    teacher: "Teacher",
    student: "Student",
    cashier: "Cashier"
  }[role] || role;
}

function setGeneralAdminView(view){
  generalAdminView = view;
  highlightViewButton();
  renderDashboard();
}

function highlightViewButton(){
  document.getElementById("btnPrimaryView").classList.toggle("active", generalAdminView === "primary");
  document.getElementById("btnSecondaryView").classList.toggle("active", generalAdminView === "secondary");
  document.getElementById("btnOverviewView").classList.toggle("active", generalAdminView === "overview");
}

/* ---------------- DASHBOARD RENDERING ---------------- */
function renderDashboard(){
  const main = document.getElementById("mainContent");
  const role = currentProfile.role;

  if(role === "general_admin"){
    main.innerHTML = renderGeneralAdmin(generalAdminView);
  } else if(role === "primary_admin"){
    main.innerHTML = renderLevelAdmin("Primary");
  } else if(role === "secondary_admin"){
    main.innerHTML = renderLevelAdmin("Secondary");
  } else if(role === "teacher"){
    main.innerHTML = renderTeacher();
  } else if(role === "student"){
    main.innerHTML = renderStudent();
  } else if(role === "cashier"){
    main.innerHTML = renderCashier();
  } else {
    main.innerHTML = `<p>Unknown role. Contact General Admin.</p>`;
  }
}

function renderGeneralAdmin(view){
  if(view === "overview"){
    return `
      <div class="section-title">Portal Overview — Both Levels</div>
      <div class="stat-row">
        <div class="stat-box"><div class="num">--</div><div class="lbl">Total Students (Primary)</div></div>
        <div class="stat-box"><div class="num">--</div><div class="lbl">Total Students (Secondary)</div></div>
        <div class="stat-box"><div class="num">--</div><div class="lbl">Total Teachers</div></div>
        <div class="stat-box"><div class="num">--</div><div class="lbl">Fees Outstanding</div></div>
      </div>
      <div class="section-title">General Admin Tools</div>
      <div class="card-grid">
        ${tile("👥","Leadership Directory")}
        ${tile("📊","Cross-Level Reports")}
        ${tile("⚙️","Portal Settings")}
        ${tile("📢","Announcements (Both Levels)")}
        ${tile("🔑","Manage Admin Accounts")}
      </div>
      <div class="placeholder-note">Live data will populate here once Students, Teachers, and Fees collections are connected.</div>
    `;
  }
  // primary or secondary drill-down view for General Admin
  const label = view === "primary" ? "Primary" : "Secondary";
  return `
    <div class="section-title">${label} — General Admin View</div>
    <div class="placeholder-note">Viewing ${label} level as General Admin. Full access to all ${label} admin tools below.</div>
    ${levelAdminTiles(label)}
  `;
}

function renderLevelAdmin(level){
  return `
    <div class="section-title">${level} Admin Dashboard</div>
    <div class="stat-row">
      <div class="stat-box"><div class="num">--</div><div class="lbl">${level} Students</div></div>
      <div class="stat-box"><div class="num">--</div><div class="lbl">${level} Teachers</div></div>
      <div class="stat-box"><div class="num">--</div><div class="lbl">Classes</div></div>
      <div class="stat-box"><div class="num">--</div><div class="lbl">Pending Results Approval</div></div>
    </div>
    ${levelAdminTiles(level)}
  `;
}

function levelAdminTiles(level){
  return `
    <div class="card-grid">
      ${tile("🧑‍🎓","Manage Students")}
      ${tile("🧑‍🏫","Manage Teachers")}
      ${tile("📝","Results Approval")}
      ${tile("🧾","Fee Records")}
      ${tile("📢","Announcements")}
      ${tile("📄","Report Cards")}
    </div>
  `;
}

function renderTeacher(){
  return `
    <div class="section-title">Teacher Dashboard — ${currentProfile.level || ""}</div>
    <div class="card-grid">
      ${tile("📤","Upload Notes")}
      ${tile("📝","Enter Results")}
      ${tile("📊","Class Performance")}
      ${tile("📢","Announcements")}
    </div>
  `;
}

function renderStudent(){
  return `
    <div class="section-title">Student Dashboard — ${currentProfile.level || ""}</div>
    <div class="card-grid">
      ${tile("🗓️","Timetable")}
      ${tile("📚","Assignments")}
      ${tile("📝","Results")}
      ${tile("💳","Fee Status")}
      ${tile("📢","Announcements")}
    </div>
  `;
}

function renderCashier(){
  return `
    <div class="section-title">Cashier Dashboard</div>
    <div class="card-grid">
      ${tile("💰","Record Payment")}
      ${tile("🧾","Generate Receipt")}
      ${tile("📊","Track Balances")}
      ${tile("📄","Reports")}
    </div>
  `;
}

function tile(icon, label){
  return `<div class="tile" onclick="alert('${label} — coming next in the build-out.')">
    <div class="icon">${icon}</div>
    <div class="label">${label}</div>
  </div>`;
}
</script>
</body>
</html>
