<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faith International School, Itobe — Portal</title>

<!-- ============================================================
  FAITH INTERNATIONAL SCHOOL, ITOBE — SCHOOL PORTAL
  Single-file HTML + Firebase (Auth + Firestore)
  Structure:
    1. General Admin  -> oversees BOTH Primary and Secondary
    2. Primary Admin   -> manages Primary level only
    3. Secondary Admin -> manages Secondary level only
    4. Teacher / Student / Cashier -> routed to their level

  FIRESTORE SCHEMA (create these collections):
    users/{uid}          { name, role, level, email }
        role: "general_admin" | "primary_admin" | "secondary_admin"
              | "teacher" | "student" | "cashier"
        level: "primary" | "secondary" | "both"  (General Admin = "both")

    students/{id}        { name, level, class, admissionNo, ... }
    teachers/{id}         { name, level, subjects, classes, ... }
    results/{id}          { studentId, level, subject, ca1, ca2, exam, term, session }
    fees/{id}              { studentId, level, amountPaid, balance, term }
    announcements/{id}   { title, body, level, date }  level:"both" = all
  ============================================================ -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root{
    --maroon:#6B0F1A;
    --maroon-dark:#4d0a13;
    --black:#111111;
    --white:#ffffff;
    --gray-bg:#f4f2f0;
    --gray-line:#e2ddd8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--gray-bg);
    color: var(--black);
    min-height:100vh;
  }
  /* subtle horseback-check motif strip */
  .check-strip{
    height:8px;
    width:100%;
    background: repeating-linear-gradient(45deg, var(--maroon) 0 10px, var(--black) 10px 20px);
  }
  .hidden{ display:none !important; }

  /* ---------- LOGIN SCREEN ---------- */
  #loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: linear-gradient(180deg, var(--white) 0%, var(--gray-bg) 100%);
    padding:20px;
  }
  .login-card{
    background:var(--white);
    border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,0.12);
    max-width:380px;
    width:100%;
    overflow:hidden;
    border:1px solid var(--gray-line);
  }
  .login-header{
    background:var(--maroon);
    color:var(--white);
    text-align:center;
    padding:28px 20px 20px;
  }
  .crest{
    width:64px; height:64px;
    margin:0 auto 10px;
  }
  .login-header h1{
    font-size:18px;
    letter-spacing:0.5px;
  }
  .login-header p{
    font-size:12px;
    opacity:0.9;
    margin-top:4px;
    font-style:italic;
  }
  .login-body{ padding:24px 24px 28px; }
  .login-body label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin:14px 0 6px;
    color:var(--black);
  }
  .login-body input{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--gray-line);
    border-radius:8px;
    font-size:15px;
  }
  .login-body input:focus{
    outline:none;
    border-color:var(--maroon);
  }
  #loginBtn{
    width:100%;
    margin-top:20px;
    padding:12px;
    background:var(--maroon);
    color:var(--white);

    border-radius:8px;
    font-size:15px;
    font-weight:600;

  #loginError{

  .login-footer{

    font-size:11px;

  /* ---------- APP SHELL ---------- */
  #appShell{ min-height:100vh; }
  header.topbar{
    background:var(--maroon);
    color:var(--white);
    padding:14px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
  }
  .topbar-left{ display:flex; align-items:center; gap:10px; }
  .topbar-left .crest-sm{ width:34px; height:34px; }
  .topbar-left h2{ font-size:15px; line-height:1.2; }
  .topbar-left span{ display:block; font-size:11px; opacity:0.85; font-style:italic; }

    font-size:11px;

  #logoutBtn{
    background:var(--white);
    color:var(--maroon);

    font-weight:600;

  .level-switch{
    display:flex;
    gap:8px;
    padding:12px 18px;

  main{ padding:18px; max-width:900px; margin:0 auto; }

    font-weight:700;
    color:var(--maroon);
    margin:20px 0 10px;
    padding-bottom:6px;
    border-bottom:2px solid var(--maroon);
  }
  .section-title:first-child{ margin-top:0; }

  .card-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px,1fr));
    gap:12px;
  }
  .tile{
    background:var(--white);
    border:1px solid var(--gray-line);
    border-radius:10px;
    padding:16px 12px;

  .tile:active{ transform:scale(0.97); background:var(--gray-bg); }

    border:1px solid #f0d98c;
    color:#7a5c00;
    font-size:12.5px;
    padding:10px 12px;
    border-radius:8px;
    margin-top:10px;
  }

  footer.foot{
    text-align:center;
    font-size:11px;
    color:#999;
    padding:24px 10px 30px;
  }

  /* ---------- MODAL ---------- */
  .modal-overlay{
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,0.5);
    display:flex;
    align-items:flex-end;
    justify-content:center;

  .modal-box{

    width:100%;

    border-radius:16px 16px 0 0;

  .modal-header{

    color:var(--white);
    padding:16px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;

  .modal-close{

  .modal-body{ padding:18px; }
  .form-group{ margin-bottom:14px; }
  .form-group label{

  .form-row .form-group{ flex:1; }
  .checkbox-grid{

    border:1px solid var(--gray-line);
    border-radius:8px;
    padding:10px;
  }
  .checkbox-grid label{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    font-weight:400;
  }
  .btn-primary{
    width:100%;
    padding:12px;
    background:var(--maroon);
    color:var(--white);
    border:none;
    border-radius:8px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    margin-top:6px;
  }
  .btn-secondary{
    width:100%;
    padding:10px;
    background:var(--gray-bg);
    color:var(--black);

  .cred-row .v{ font-size:14px; font-weight:600; }
  .cred-warning{

  #printArea{ display:none; }

  }
</style>

<script>
/* ============================================================
   FIREBASE CONFIG
   Replace with your own Firebase project keys before deploying.
   Create a SEPARATE Firebase project from FISSI Connect.
============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyBhSTNPcF8jd9XJ_J2cPCuedbaAYp58X5I",
  authDomain: "fiss-itobe-portal.firebaseapp.com",
  projectId: "fiss-itobe-portal",
  storageBucket: "fiss-itobe-portal.firebasestorage.app",

};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// Secondary Firebase app instance — used ONLY for creating new accounts,
// so that creating a user doesn't log the admin out of their own session.
const secondaryApp = firebase.initializeApp(firebaseConfig, "Secondary");
const secondaryAuth = secondaryApp.auth();

const PRIMARY_CLASSES = ["Nursery 1","Nursery 2","Primary 1","Primary 2","Primary 3","Primary 4","Primary 5","Primary 6"];
const SECONDARY_CLASSES = ["JSS 1","JSS 2","JSS 3","SS 1","SS 2","SS 3"];
const PRIMARY_SUBJECTS = ["Mathematics","English","Basic Science","Social Studies","Civic Education","Agricultural Science","CRK/IRK","Handwriting","Verbal Reasoning","Quantitative Reasoning"];
const SECONDARY_SUBJECTS = ["Mathematics","English","Basic Science","Civic Education","Social Studies","Agricultural Science","Business Studies","French","CRK/IRK","Computer Studies","Physics","Chemistry","Biology","Government","Economics","Literature","Geography"];

const TERMS = ["First Term","Second Term","Third Term"];

function waecGrade(total){
  if(total >= 75) return { grade: "A1", remark: "Excellent" };
  if(total >= 70) return { grade: "B2", remark: "Very Good" };
  if(total >= 65) return { grade: "B3", remark: "Good" };
  if(total >= 60) return { grade: "C4", remark: "Credit" };
  if(total >= 55) return { grade: "C5", remark: "Credit" };
  if(total >= 50) return { grade: "C6", remark: "Credit" };
  if(total >= 45) return { grade: "D7", remark: "Pass" };
  if(total >= 40) return { grade: "E8", remark: "Pass" };
  return { grade: "F9", remark: "Fail" };
}

function resultDocId(studentUid, subject, term, session){
  const clean = s => String(s).trim().replace(/[^a-zA-Z0-9]+/g, "_");
  return `${studentUid}_${clean(subject)}_${clean(term)}_${clean(session)}`;
}

// Surfaces any JS error as a visible alert instead of failing silently.
// This is what "Submit for Approval" and "Load CA List" needed —
// on mobile there's no easy way to check a browser console, so this
// makes the actual error message visible directly on screen.
window.onerror = function(message, source, lineno, colno, error){
  alert("Portal error: " + message + " (line " + lineno + ")");
  return false;
};

// Opens print content in its own genuine browser tab (via a Blob URL,
// not window.open + document.write — that combination proved unreliable
// on some Android Chrome builds and could show stale content). Nothing
// prints automatically: the new tab shows the content plus its own
// visible Print button, so what you see is exactly what will print.
function openPrintWindow(bodyHTML){
  const fullHTML = `<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faith International School, Itobe — Print</title>
  <style>
    body{ font-family: Georgia, 'Times New Roman', serif; color:#111; margin:20px; }
    table{ width:100%; border-collapse:collapse; }
    th, td{ border:1px solid #000; padding:6px 8px; text-align:left; font-size:13px; }
    .print-btn-bar{ text-align:center; margin-bottom:20px; }
    .print-btn-bar button{
      padding:14px 28px; font-size:16px; font-weight:700; color:#fff;
      background:#6B0F1A; border:none; border-radius:8px;
    }
    @media print{ .print-btn-bar{ display:none !important; } }
  </style>
</head>
<body>
  <div class="print-btn-bar"><button onclick="window.print()">🖨️ Print This Page</button></div>
  ${bodyHTML}
</body>
</html>`;

  const blob = new Blob([fullHTML], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  const win = window.open(url, "_blank");
  if(!win){
    alert("Please allow pop-ups for this site so receipts and reports can open for printing.");
  }
}

// Reliably prints #printArea's current content. A fixed setTimeout isn't
// guaranteed to run after the browser has actually finished painting the
// new content on every device — forcing a layout read, then waiting two
// animation frames, guarantees at least one full paint cycle has
// completed before the print dialog opens. This is what stops the print
// from occasionally capturing the previous on-screen content instead of
// the freshly built printArea content.
function triggerPrint(){
  document.getElementById("printArea").offsetHeight; // force synchronous layout flush
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      window.print();
    });
  });
}

// Safely embed a JSON value inside a double-quoted onclick="..." attribute.
// JSON.stringify() alone produces double quotes that prematurely close the
// attribute (this was the cause of "Submit for Approval" and similar
// buttons doing nothing when tapped — the browser silently drops a broken
// inline handler with no visible error). &quot; is decoded back to " by
// the browser before the JS runs, so the call still receives the real value.
function js(v){
  return JSON.stringify(v).replace(/"/g, "&quot;");
}

let currentUser = null;   // Firebase auth user
let defaultTerm = "";     // Populated by loadPortalSettings(); safe default until then
let defaultSession = "";  // Populated by loadPortalSettings(); safe default until then
let currentProfile = null; // Firestore users/{uid} doc: {name, role, level}
let generalAdminView = "overview"; // "primary" | "secondary" | "overview"
let manageAccountsContext = "general"; // "general" | "primary" | "secondary"
let editingUid = null;
let resultsApprovalContext = "general"; // "general" | "primary" | "secondary"
let currentResultsBatch = []; // rows currently loaded in teacher-entry or admin-approval screen
let feeManagerContext = "cashier"; // "cashier" | "primary" | "secondary" | "general"
let currentFeeBatch = [];

/* ---------------- LOGIN / LOGOUT ---------------- */
function handleLogin(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const errBox = document.getElementById("loginError");
  errBox.textContent = "";

  if(!email || !password){
    errBox.textContent = "Please enter both email and password.";
    return;
  }

  document.getElementById("loginBtn").textContent = "Logging in...";

  auth.signInWithEmailAndPassword(email, password)
    .catch(err => {
      errBox.textContent = "Login failed: " + err.message;
      document.getElementById("loginBtn").textContent = "Log In";
    });
}

function handleLogout(){
  auth.signOut();
}

auth.onAuthStateChanged(async (user) => {
  if(user){
    currentUser = user;
    await loadUserProfile(user.uid);
  } else {
    currentUser = null;
    currentProfile = null;
    document.getElementById("loginScreen").classList.remove("hidden");
    document.getElementById("appShell").classList.add("hidden");
    document.getElementById("loginBtn").textContent = "Log In";
  }
});

async function loadUserProfile(uid){
  try{
    const doc = await db.collection("users").doc(uid).get();
    if(!doc.exists){
      document.getElementById("loginError").textContent =
        "No profile found for this account. Contact General Admin.";
      auth.signOut();
      return;
    }
    currentProfile = doc.data(); // { name, role, level, email }
    enterPortal();
  } catch(e){
    document.getElementById("loginError").textContent = "Error loading profile: " + e.message;
    document.getElementById("loginBtn").textContent = "Log In";
  }
}

/* ---------------- ROUTING ---------------- */
function enterPortal(){
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("appShell").classList.remove("hidden");

  document.getElementById("userNameBadge").textContent = currentProfile.name || currentUser.email;
  document.getElementById("userRoleLabel").textContent = roleLabel(currentProfile.role);

  const levelSwitch = document.getElementById("levelSwitch");
  if(currentProfile.role === "general_admin"){
    levelSwitch.classList.remove("hidden");
    generalAdminView = "overview";
    highlightViewButton();
  } else {
    levelSwitch.classList.add("hidden");
  }

  renderDashboard();
}

function roleLabel(role){
  return {
    general_admin: "General Admin — Oversees Primary & Secondary",
    primary_admin: "Primary Admin",
    secondary_admin: "Secondary Admin",
    teacher: "Teacher",
    student: "Student",
    cashier: "Cashier"
  }[role] || role;
}

function setGeneralAdminView(view){
  generalAdminView = view;
  highlightViewButton();
  renderDashboard();
}

function highlightViewButton(){
  document.getElementById("btnPrimaryView").classList.toggle("active", generalAdminView === "primary");

async function loadOverviewStats(){
  try{
    const [studentSnap, teacherSnap, feesSnap] = await Promise.all([
      db.collection("users").where("role","==","student").get(),
      db.collection("users").where("role","==","teacher").get(),
      db.collection("fees").get()
    ]);

    let primaryStudents = 0, secondaryStudents = 0;
    studentSnap.forEach(doc => {
      const lvl = doc.data().level;
      if(lvl === "primary") primaryStudents++;
      else if(lvl === "secondary") secondaryStudents++;
    });

    let outstanding = 0;
    feesSnap.forEach(doc => {
      const d = doc.data();
      outstanding += (d.totalFee || 0) - (d.amountPaid || 0);
    });

    const setText = (id, val) => { const el = document.getElementById(id); if(el) el.textContent = val; };
    setText("statPrimaryStudents", primaryStudents);
    setText("statSecondaryStudents", secondaryStudents);
    setText("statTotalTeachers", teacherSnap.size);
    setText("statFeesOutstanding", "₦" + outstanding);
  } catch(e){
    // Stat boxes silently stay at "--" if this fails; not critical to block the dashboard.
  }
}

      <option value="cashier">Cashier</option>

/* ============================================================
   MANAGE ACCOUNTS — list, edit, remove existing teacher/student/cashier accounts.
   context: "general" (all levels), "primary", "secondary"
============================================================ */
let lastManageAccountsUsers = [];

async function openManageAccounts(context){
  manageAccountsContext = context;
  const main = document.getElementById("mainContent");
  main.innerHTML = `<div class="section-title">Manage Accounts</div><div class="placeholder-note">Loading accounts...</div>`;

  try{
    const snap = await db.collection("users").where("role","in",["teacher","student","cashier"]).get();
    let users = [];
    snap.forEach(doc => users.push({ uid: doc.id, ...doc.data() }));

    if(context !== "general"){
      users = users.filter(u => u.level === context || u.level === "both");
    }

    lastManageAccountsUsers = users;
    renderManageAccountsList(users);
  } catch(e){
    main.innerHTML = `<div class="section-title">Manage Accounts</div><div class="field-error">Error loading accounts: ${e.message}</div>`;
  }
}

function filterStudentsByClass(cls){
  const filtered = cls
    ? lastManageAccountsUsers.filter(u => u.role !== "student" || u.class === cls)
    : lastManageAccountsUsers;
  renderManageAccountsList(filtered, cls);
}

function renderManageAccountsList(users, activeClassFilter){
  const main = document.getElementById("mainContent");
  const grouped = { teacher: [], student: [], cashier: [] };
  users.forEach(u => { if(grouped[u.role]) grouped[u.role].push(u); });

  const lockedLevel = (manageAccountsContext === "primary" || manageAccountsContext === "secondary") ? manageAccountsContext : null;
  const classFilterOptions = classOptionsHTML(lockedLevel);

  const rowHTML = (u) => `
    <div style="display:flex; justify-content:space-between; align-items:center; border:1px solid var(--gray-line); border-radius:8px; padding:10px 14px; margin-bottom:8px; gap:10px;">
      <div style="min-width:0;">
        <div style="font-weight:600;">${u.name || "(no name)"}</div>
        <div style="font-size:12px; color:#666; overflow-wrap:anywhere;">
          ${u.email || ""}
          ${u.class ? " · " + (Array.isArray(u.class) ? u.class.join(", ") : u.class) : ""}
          ${u.subjects ? " · " + u.subjects.join(", ") : ""}
        </div>
      </div>
      <div style="display:flex; gap:8px; flex-shrink:0;">
        <button class="btn-secondary" onclick="openEditAccountModal('${u.uid}')">Edit</button>
        <button class="btn-secondary" style="color:#b00020;" onclick="removeAccountConfirm('${u.uid}', ${js(u.name || "this user")})">Remove</button>
      </div>
    </div>
  `;

  const section = (label, list) => {
    if(label !== "Students"){
      return `
        <div class="section-title">${label} (${list.length})</div>
        ${list.length === 0 ? `<div class="placeholder-note">No ${label.toLowerCase()} accounts yet.</div>` : list.map(rowHTML).join("")}
      `;
    }
    return `
      <div class="section-title">Students (${list.length})</div>
      <div style="display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap;">
        <button class="btn-secondary" style="width:auto; margin:0;" onclick="openAccountModal('${manageAccountsContext}', 'student')">➕ Add Single Student</button>
        <button class="btn-secondary" style="width:auto; margin:0;" onclick="openBulkAddStudents()">➕ Add Students in Bulk</button>
      </div>
      <div class="form-group" style="max-width:280px;">
        <label>Filter by Class</label>
        <select onchange="filterStudentsByClass(this.value)">
          <option value="">All Classes</option>
          ${classFilterOptions}
        </select>
      </div>
      ${list.length === 0 ? `<div class="placeholder-note">No student accounts${activeClassFilter ? ` in ${activeClassFilter}` : ""}.</div>` : list.map(rowHTML).join("")}
    `;
  };

  main.innerHTML = `
    <button class="btn-secondary" onclick="renderDashboard()">&larr; Back to Dashboard</button>
    <div style="margin-top:12px;">
      ${section("Teachers", grouped.teacher)}
      ${section("Students", grouped.student)}
      ${section("Cashiers", grouped.cashier)}
    </div>
  `;

  if(activeClassFilter){
    // restore the dropdown's selected value after re-render
    const sel = main.querySelector('select[onchange^="filterStudentsByClass"]');
    if(sel) sel.value = activeClassFilter;
  }
}

async function openEditAccountModal(uid){
  editingUid = uid;
  const modal = document.getElementById("accountModal");
  const body = document.getElementById("modalBody");
  document.getElementById("modalTitle").textContent = "Edit Account";
  body.innerHTML = `<div class="placeholder-note">Loading...</div>`;
  modal.classList.remove("hidden");

  let docSnap;
  try{
    docSnap = await db.collection("users").doc(uid).get();
  } catch(e){
    body.innerHTML = `<div class="field-error">Error loading account: ${e.message}</div>`;
    return;
  }
  if(!docSnap.exists){
    body.innerHTML = `<div class="field-error">Account not found. It may have already been removed.</div>`;
    return;
  }
  const data = docSnap.data();

  let assignmentHTML = "";
  if(data.role === "teacher"){
    const level = data.level;
    const classList = level === "secondary" ? SECONDARY_CLASSES : level === "primary" ? PRIMARY_CLASSES : [...PRIMARY_CLASSES, ...SECONDARY_CLASSES];
    const subjectList = level === "secondary" ? SECONDARY_SUBJECTS : level === "primary" ? PRIMARY_SUBJECTS : [...new Set([...PRIMARY_SUBJECTS, ...SECONDARY_SUBJECTS])];
    const currentClasses = Array.isArray(data.class) ? data.class : (data.class ? [data.class] : []);
    const currentSubjects = data.subjects || [];

    assignmentHTML = `
      <div class="form-group">
        <label>Classes Taught</label>
        <div class="checkbox-grid" id="editClassGrid">
          ${classList.map(c => `<label><input type="checkbox" value="${c}" ${currentClasses.includes(c) ? "checked" : ""}> ${c}</label>`).join("")}
        </div>
      </div>
      <div class="form-group">
        <label>Subjects Taught</label>
        <div class="checkbox-grid" id="editSubjectGrid">
          ${subjectList.map(s => `<label><input type="checkbox" value="${s}" ${currentSubjects.includes(s) ? "checked" : ""}> ${s}</label>`).join("")}
        </div>
      </div>
    `;
  } else if(data.role === "student"){
    const classList = data.level === "primary" ? PRIMARY_CLASSES : SECONDARY_CLASSES;
    assignmentHTML = `
      <div class="form-group">
        <label>Class</label>
        <select id="editClass">
          ${classList.map(c => `<option value="${c}" ${c === data.class ? "selected" : ""}>${c}</option>`).join("")}
        </select>
      </div>
    `;
  } else if(data.role === "cashier"){
    assignmentHTML = `
      <div class="form-group">
        <label>Assigned Level</label>
        <select id="editLevel">
          <option value="both" ${data.level === "both" ? "selected" : ""}>Both Levels</option>
          <option value="primary" ${data.level === "primary" ? "selected" : ""}>Primary Only</option>
          <option value="secondary" ${data.level === "secondary" ? "selected" : ""}>Secondary Only</option>
        </select>
      </div>
    `;
  }

  body.innerHTML = `
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="editName" value="${(data.name || "").replace(/"/g,"&quot;")}">
    </div>
    <div class="placeholder-note">Role: ${roleLabel(data.role)} — email and password cannot be changed here.</div>
    ${assignmentHTML}
    <div class="field-error" id="editError"></div>
    <button class="btn-primary" onclick="submitEditAccount()">Save Changes</button>
  `;
}

async function submitEditAccount(){
  const errBox = document.getElementById("editError");
  errBox.textContent = "";

  const name = document.getElementById("editName").value.trim();
  if(!name){
    errBox.textContent = "Name is required.";
    return;
  }

  const updates = { name };

  const classGrid = document.getElementById("editClassGrid");
  const subjectGrid = document.getElementById("editSubjectGrid");
  const classSelect = document.getElementById("editClass");
  const levelSelect = document.getElementById("editLevel");

  if(classGrid){
    const checkedClasses = [...classGrid.querySelectorAll("input:checked")].map(c => c.value);
    if(checkedClasses.length === 0){
      errBox.textContent = "Please select at least one class.";
      return;
    }
    updates.class = checkedClasses;
  }
  if(subjectGrid){
    const checkedSubjects = [...subjectGrid.querySelectorAll("input:checked")].map(s => s.value);
    if(checkedSubjects.length === 0){
      errBox.textContent = "Please select at least one subject.";
      return;
    }
    updates.subjects = checkedSubjects;
  }
  if(classSelect){
    updates.class = classSelect.value;
  }
  if(levelSelect){
    updates.level = levelSelect.value;
  }

  try{
    await db.collection("users").doc(editingUid).update(updates);
    closeAccountModal();
    openManageAccounts(manageAccountsContext);
  } catch(e){
    errBox.textContent = "Error saving: " + e.message;
  }
}

async function removeAccountConfirm(uid, name){
  if(!confirm(`Remove ${name}'s account? This immediately blocks their portal login. This cannot be undone from here.`)) return;
  try{
    await db.collection("users").doc(uid).delete();
    openManageAccounts(manageAccountsContext);
  } catch(e){
    alert("Error removing account: " + e.message);
  }
}

/* ============================================================
   RESULTS WORKFLOW
   Stage 1: Teacher submits scores (status: "submitted")
   Stage 2: Admin generates/finalizes (status: "generated")
   Stage 3: Admin releases per student (released: true), or withholds (withheld: true)
   Students only ever see results where released === true.
   Result doc id: `${studentUid}_${subject}_${term}_${session}` (deterministic upsert)
============================================================ */

/* ---------- STAGE 1: TEACHER ENTRY ---------- */
function openEnterResults(){
  const main = document.getElementById("mainContent");
  const myClasses = Array.isArray(currentProfile.class) ? currentProfile.class : (currentProfile.class ? [currentProfile.class] : []);
  const mySubjects = currentProfile.subjects || [];

  if(myClasses.length === 0 || mySubjects.length === 0){
    main.innerHTML = `
      <button class="btn-secondary" onclick="renderDashboard()">&larr; Back to Dashboard</button>
      <div class="section-title" style="margin-top:12px;">Enter Results</div>
      <div class="placeholder-note">No classes or subjects are assigned to your account yet. Contact your Admin.</div>
    `;
    return;
  }

  main.innerHTML = `
    <button class="btn-secondary" onclick="renderDashboard()">&larr; Back to Dashboard</button>
    <div class="section-title" style="margin-top:12px;">Enter Results</div>
    <div class="form-group">
      <label>Class</label>
      <select id="rClass">${myClasses.map(c => `<option value="${c}">${c}</option>`).join("")}</select>
    </div>
    <div class="form-group">
      <label>Subject</label>
      <select id="rSubject">${mySubjects.map(s => `<option value="${s}">${s}</option>`).join("")}</select>
    </div>
    <div class="form-group">
      <label>Term</label>
      <select id="rTerm">${TERMS.map(t => `<option value="${t}">${t}</option>`).join("")}</select>
    </div>
    <div class="form-group">
      <label>Session</label>
      <input type="text" id="rSession" placeholder="e.g. 2025/2026">
    </div>
    <button class="btn-primary" onclick="loadStudentsForResults()">Load Students</button>
    <div class="field-error" id="rError"></div>
    <div id="rResultsArea" style="margin-top:16px;"></div>
  `;
}

async function loadStudentsForResults(){
  const errBox = document.getElementById("rError");
  errBox.textContent = "";
  const cls = document.getElementById("rClass").value;
  const subject = document.getElementById("rSubject").value;
  const term = document.getElementById("rTerm").value;
  const session = document.getElementById("rSession").value.trim();

  if(!session){
    errBox.textContent = "Please enter the session (e.g. 2025/2026).";
    return;
  }

  const area = document.getElementById("rResultsArea");
  area.innerHTML = `<div class="placeholder-note">Loading students...</div>`;

  try{
    const snap = await db.collection("users").where("role","==","student").where("class","==",cls).get();
    let students = [];
    snap.forEach(doc => students.push({ uid: doc.id, ...doc.data() }));
    students.sort((a,b) => (a.name || "").localeCompare(b.name || ""));

    if(students.length === 0){
      area.innerHTML = `<div class="placeholder-note">No students found in ${cls}.</div>`;
      currentResultsBatch = [];
      return;
    }

    // Pre-fill from any existing (not-yet-generated) results
    const existing = await Promise.all(students.map(s =>
      db.collection("results").doc(resultDocId(s.uid, subject, term, session)).get()
    ));

    currentResultsBatch = students.map((s, i) => {
      const ex = existing[i].exists ? existing[i].data() : null;
      return {
        uid: s.uid, name: s.name || "(no name)",
        ca1: ex ? ex.ca1 : "", ca2: ex ? ex.ca2 : "", exam: ex ? ex.exam : "",
        locked: ex ? (ex.status === "generated") : false
      };
    });

    renderTeacherResultsTable(cls, subject, term, session);
  } catch(e){
    area.innerHTML = `<div class="field-error">Error loading students: ${e.message}</div>`;
  }
}

function renderTeacherResultsTable(cls, subject, term, session){
  const area = document.getElementById("rResultsArea");
  const rows = currentResultsBatch.map((s, i) => `
    <div style="display:flex; align-items:center; gap:8px; border:1px solid var(--gray-line); border-radius:8px; padding:8px 10px; margin-bottom:6px; ${s.locked ? "opacity:0.55;" : ""}">
      <div style="flex:1; min-width:0; font-weight:600; overflow-wrap:anywhere;">${s.name}</div>
      <input type="number" min="0" max="20" placeholder="CA1" value="${s.ca1}" ${s.locked ? "disabled" : ""} style="width:56px;" onchange="currentResultsBatch[${i}].ca1=this.value">
      <input type="number" min="0" max="20" placeholder="CA2" value="${s.ca2}" ${s.locked ? "disabled" : ""} style="width:56px;" onchange="currentResultsBatch[${i}].ca2=this.value">
      <input type="number" min="0" max="60" placeholder="Exam" value="${s.exam}" ${s.locked ? "disabled" : ""} style="width:56px;" onchange="currentResultsBatch[${i}].exam=this.value">
    </div>
  `).join("");

  const anyLocked = currentResultsBatch.some(s => s.locked);

  area.innerHTML = `
    <div style="display:flex; gap:8px; font-size:12px; color:#666; padding:0 10px; margin-bottom:6px;">
      <div style="flex:1;">Student</div><div style="width:56px;">CA1/20</div><div style="width:56px;">CA2/20</div><div style="width:56px;">Exam/60</div>
    </div>
    ${rows}
    ${anyLocked ? `<div class="placeholder-note">Some results here have already been finalized by Admin and can no longer be edited by you.</div>` : ""}
    <button class="btn-primary" onclick="submitTeacherResults('${cls}','${subject}','${term}',${js(session)})">Submit for Approval</button>
  `;
}

async function submitTeacherResults(cls, subject, term, session){
  const errBox = document.getElementById("rError");
  errBox.textContent = "";

  const toSave = currentResultsBatch.filter(s => !s.locked);
  for(const s of toSave){
    if(s.ca1 === "" || s.ca2 === "" || s.exam === ""){
      errBox.textContent = `Please fill CA1, CA2, and Exam for ${s.name} (or leave the whole row untouched to skip).`;
      return;
    }
  }
  const filled = toSave.filter(s => s.ca1 !== "" && s.ca2 !== "" && s.exam !== "");
  if(filled.length === 0){
    errBox.textContent = "No scores entered.";
    return;
  }

  try{
    await Promise.all(filled.map(s => {
      const ca1 = Number(s.ca1), ca2 = Number(s.ca2), exam = Number(s.exam);
      const total = ca1 + ca2 + exam;
      const { grade, remark } = waecGrade(total);
      return db.collection("results").doc(resultDocId(s.uid, subject, term, session)).set({
        studentUid: s.uid, studentName: s.name, class: cls, level: currentProfile.level,
        subject, term, session, ca1, ca2, exam, total, grade, remark,
        status: "submitted", released: false, withheld: false,
        submittedBy: currentUser.uid, submittedAt: new Date().toISOString()
      }, { merge: true });
    }));
    document.getElementById("rResultsArea").innerHTML = `<div class="placeholder-note">Results submitted for approval. You can come back to edit them until Admin finalizes.</div>`;
  } catch(e){
    errBox.textContent = "Error submitting: " + e.message;
  }
}

// Loads EVERY subject's results for the whole class at once — this is
// the class-wide view Admin uses day-to-day, instead of picking one
// subject at a time.
async function loadResultsForApproval(){
  const errBox = document.getElementById("aError");
  errBox.textContent = "";
  const cls = document.getElementById("aClass").value;
  const term = document.getElementById("aTerm").value;
  const session = document.getElementById("aSession").value.trim();

  if(!session){
    errBox.textContent = "Please enter the session (e.g. 2025/2026).";
    return;
  }

  const area = document.getElementById("aResultsArea");
  area.innerHTML = `<div class="placeholder-note">Loading results...</div>`;

  try{
    const snap = await db.collection("results")
      .where("class","==",cls).where("term","==",term).where("session","==",session)
      .get();

    let results = [];
    snap.forEach(doc => results.push({ id: doc.id, ...doc.data() }));

    renderClassApprovalSummary(results, cls, term, session);
  } catch(e){
    area.innerHTML = `<div class="field-error">Error loading results: ${e.message}</div>`;
  }
}

function renderClassApprovalSummary(results, cls, term, session){
  const area = document.getElementById("aResultsArea");

  if(results.length === 0){
    area.innerHTML = `<div class="placeholder-note">No submitted results yet for ${cls} · ${term} · ${session}.</div>`;
    return;
  }

  const submittedTotal = results.filter(r => r.status === "submitted").length;
  const generatedTotal = results.filter(r => r.status === "generated").length;

  // Per-subject breakdown so Admin can see progress across the whole class at a glance
  const bySubject = {};
  results.forEach(r => {
    if(!bySubject[r.subject]) bySubject[r.subject] = { submitted: 0, generated: 0 };
    bySubject[r.subject][r.status === "generated" ? "generated" : "submitted"]++;
  });

  const subjectRows = Object.keys(bySubject).sort().map(subj => `
    <tr>
      <td style="padding:6px 4px;">${subj}</td>
      <td style="padding:6px 4px;">${bySubject[subj].submitted}</td>
      <td style="padding:6px 4px;">${bySubject[subj].generated}</td>
      <td style="padding:6px 4px;"><button class="btn-secondary" style="width:auto; margin:0; font-size:12px; padding:6px 10px;" onclick="openSubjectApprovalDetail('${cls}','${subj}','${term}',${js(session)})">Manage</button></td>
    </tr>
  `).join("");

  area.innerHTML = `
    <div style="display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap;">
      <button class="btn-primary" style="width:auto; margin:0;" ${submittedTotal === 0 ? "disabled" : ""} onclick="generateAllSubjects('${cls}','${term}',${js(session)})">Generate All Subjects (${submittedTotal} pending)</button>
      <button class="btn-primary" style="width:auto; margin:0;" ${generatedTotal === 0 ? "disabled" : ""} onclick="releaseAllSubjects('${cls}','${term}',${js(session)})">Release All Subjects</button>
    </div>
    <div style="overflow-x:auto;">
      <table style="width:100%; border-collapse:collapse; font-size:13px;">
        <thead>
          <tr style="text-align:left; border-bottom:2px solid var(--gray-line);">
            <th style="padding:6px 4px;">Subject</th><th style="padding:6px 4px;">Awaiting</th><th style="padding:6px 4px;">Generated</th><th></th>
          </tr>
        </thead>
        <tbody>${subjectRows}</tbody>
      </table>
    </div>
    <div class="placeholder-note" style="margin-top:12px;">Tap "Manage" next to a subject to withhold or release individual students. Otherwise, the two buttons above handle the whole class in one tap.</div>
  `;
}

async function generateAllSubjects(cls, term, session){
  try{
    const snap = await db.collection("results")
      .where("class","==",cls).where("term","==",term).where("session","==",session)
      .where("status","==","submitted")
      .get();

    const refs = [];
    snap.forEach(doc => refs.push(doc.ref));

    await Promise.all(refs.map(ref => ref.update({
      status: "generated",
      generatedBy: currentUser.uid,
      generatedAt: new Date().toISOString()
    })));

    loadResultsForApproval();
  } catch(e){
    document.getElementById("aError").textContent = "Error generating results: " + e.message;
  }
}

async function releaseAllSubjects(cls, term, session){
  try{
    const snap = await db.collection("results")
      .where("class","==",cls).where("term","==",term).where("session","==",session)
      .where("status","==","generated").where("withheld","==",false)
      .get();

    const refs = [];
    snap.forEach(doc => refs.push(doc.ref));

    await Promise.all(refs.map(ref => ref.update({
      released: true, releasedBy: currentUser.uid, releasedAt: new Date().toISOString()
    })));

    loadResultsForApproval();
  } catch(e){
    document.getElementById("aError").textContent = "Error releasing results: " + e.message;
  }
}

    <div style="display:flex; justify-content:space-between; align-items:center; border:1px solid var(--gray-line); border-radius:8px; padding:8px 10px; margin-bottom:6px;">

  const finalizedRows = finalized.map(r => `

/* ============================================================
   FEE RECORDS
   Cashier records payments (atomic increments to avoid concurrent-write loss).
   Admin (level or general) can view/edit the same way.
   Student sees own balance only, read-only.
   Fee doc id: `${studentUid}_${term}_${session}` (deterministic upsert)
============================================================ */
function classListForLevel(level){
  if(level === "primary") return PRIMARY_CLASSES;
  if(level === "secondary") return SECONDARY_CLASSES;
  return [...PRIMARY_CLASSES, ...SECONDARY_CLASSES];
}

function feeDocId(studentUid, term, session){
  const clean = s => String(s).trim().replace(/[^a-zA-Z0-9]+/g, "_");
  return `${studentUid}_${clean(term)}_${clean(session)}`;
}

function openFeeManager(context){
  feeManagerContext = context;
  const main = document.getElementById("mainContent");
  const classList = context === "cashier" ? classListForLevel(currentProfile.level) : classListForLevel(context);

  main.innerHTML = `
    <button class="btn-secondary" onclick="renderDashboard()">&larr; Back to Dashboard</button>
    <div class="section-title" style="margin-top:12px;">Fee Records</div>
    <div class="form-group">
      <label>Class</label>
      <select id="fClass">${classList.map(c => `<option value="${c}">${c}</option>`).join("")}</select>
    </div>
    <div class="form-group">
      <label>Term</label>
      <select id="fTerm">${TERMS.map(t => `<option value="${t}">${t}</option>`).join("")}</select>
    </div>
    <div class="form-group">
      <label>Session</label>
      <input type="text" id="fSession" placeholder="e.g. 2025/2026">
    </div>
    <button class="btn-primary" onclick="loadFeeRecords()">Load Students</button>
    <div class="field-error" id="fError"></div>
    <div id="fResultsArea" style="margin-top:16px;"></div>
  `;
}

async function loadFeeRecords(){
  const errBox = document.getElementById("fError");
  errBox.textContent = "";
  const cls = document.getElementById("fClass").value;
  const term = document.getElementById("fTerm").value;
  const session = document.getElementById("fSession").value.trim();

  if(!session){
    errBox.textContent = "Please enter the session (e.g. 2025/2026).";
    return;
  }

  const area = document.getElementById("fResultsArea");
  area.innerHTML = `<div class="placeholder-note">Loading students...</div>`;

  try{
    const snap = await db.collection("users").where("role","==","student").where("class","==",cls).get();
    let students = [];
    snap.forEach(doc => students.push({ uid: doc.id, ...doc.data() }));
    students.sort((a,b) => (a.name || "").localeCompare(b.name || ""));

    if(students.length === 0){
      area.innerHTML = `<div class="placeholder-note">No students found in ${cls}.</div>`;
      currentFeeBatch = [];
      return;
    }

    const level = PRIMARY_CLASSES.includes(cls) ? "primary" : "secondary";
    const feeSnaps = await Promise.all(students.map(s =>
      db.collection("fees").doc(feeDocId(s.uid, term, session)).get()
    ));

    currentFeeBatch = students.map((s, i) => {
      const fd = feeSnaps[i].exists ? feeSnaps[i].data() : null;
      return {
        uid: s.uid, name: s.name || "(no name)", class: cls, level,
        totalFee: fd ? (fd.totalFee || 0) : 0,
        amountPaid: fd ? (fd.amountPaid || 0) : 0
      };
    });

    renderFeeTable(cls, term, session);
  } catch(e){
    area.innerHTML = `<div class="field-error">Error loading students: ${e.message}</div>`;
  }
}

function renderFeeTable(cls, term, session){
  const area = document.getElementById("fResultsArea");
  const rows = currentFeeBatch.map((s, i) => {
    const balance = s.totalFee - s.amountPaid;
    return `
      <div style="border:1px solid var(--gray-line); border-radius:8px; padding:10px; margin-bottom:8px;">
        <div style="font-weight:600; margin-bottom:6px; overflow-wrap:anywhere;">${s.name}</div>
        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
          <label style="font-size:12px;">Total Fee ₦
            <input type="number" min="0" value="${s.totalFee}" style="width:90px;"
              onchange="setTotalFee(${i}, this.value, '${cls}', '${term}', ${js(session)})">
          </label>
          <span style="font-size:12px;">Paid: ₦${s.amountPaid}</span>
          <span style="font-size:12px; font-weight:700; color:${balance > 0 ? "#b00020" : "#1a7a1a"};">Balance: ₦${balance}</span>
        </div>
        <div style="display:flex; gap:6px; align-items:center; margin-top:8px;">
          <input type="number" min="1" placeholder="Add payment ₦" id="pay_${i}" style="width:130px;">
          <button class="btn-secondary" onclick="addPayment(${i}, '${cls}', '${term}', ${js(session)})">Add Payment</button>
        </div>
      </div>
    `;
  }).join("");

  area.innerHTML = `
    <button class="btn-secondary" onclick="printFeeList('${cls}','${term}',${js(session)})">🖨️ Print Fee List</button>
    <div style="margin-top:10px;">${rows}</div>
  `;
}

async function printFeeList(cls, term, session){
  const rows = currentFeeBatch.map(s => {
    const balance = s.totalFee - s.amountPaid;
    return `<tr><td>${s.name}</td><td>₦${s.totalFee}</td><td>₦${s.amountPaid}</td><td>₦${balance}</td></tr>`;
  }).join("");

async function setTotalFee(i, value, cls, term, session){

  try{

    }, { merge: true });

function generateReceiptNo(){
  // Timestamp-based, no shared counter doc — avoids the same concurrent-write
  // conflict that the fee totals fix (FieldValue.increment) was built to solve.
  return "FIS-" + Date.now().toString(36).toUpperCase();
}

async function addPayment(i, cls, term, session){
  const input = document.getElementById(`pay_${i}`);
  const amount = Number(input.value);
  if(!amount || amount <= 0){
    alert("Enter a valid payment amount.");
    return;
  }
  const s = currentFeeBatch[i];
  const receiptNo = generateReceiptNo();
  const createdAt = new Date().toISOString();

  try{
    // Atomic increment avoids losing payments if two cashiers record at once.
    await db.collection("fees").doc(feeDocId(s.uid, term, session)).set({
      studentUid: s.uid, studentName: s.name, class: cls, level: s.level, term, session,
      amountPaid: firebase.firestore.FieldValue.increment(amount),
      updatedAt: createdAt, updatedBy: currentUser.uid
    }, { merge: true });

    // Individual payment ledger entry — powers receipts and the transaction report.
    // feeTransactions docs are never edited or deleted once written.
    const txnRef = await db.collection("feeTransactions").add({
      studentUid: s.uid, studentName: s.name, class: cls, level: s.level, term, session,
      amount, receiptNo,
      cashierUid: currentUser.uid, cashierName: currentProfile.name || currentUser.email,
      createdAt
    });

    s.amountPaid += amount;
    renderFeeTable(cls, term, session);

    printReceipt({
      studentName: s.name, class: cls, level: s.level, term, session,
      amount, receiptNo, cashierName: currentProfile.name || currentUser.email, createdAt
    });
  } catch(e){
    alert("Error recording payment: " + e.message);
  }
}

async function searchReceipts(){

  const area = document.getElementById("receiptResultsArea");
  errBox.textContent = "";
  const q = document.getElementById("receiptSearch").value.trim().toLowerCase();

  if(!q){
    errBox.textContent = "Enter a student name or receipt number.";
    return;
  }

  area.innerHTML = `<div class="placeholder-note">Searching...</div>`;

  try{
    // Fetched client-side filtered since Firestore can't do partial-text search;
    // cashier volumes here are small enough for this to stay fast.
    const snap = await db.collection("feeTransactions").orderBy("createdAt","desc").limit(200).get();
    let results = [];
    snap.forEach(doc => {
      const d = doc.data();
      if((d.studentName || "").toLowerCase().includes(q) || (d.receiptNo || "").toLowerCase().includes(q)){
        results.push(d);

  }
}

function generatePassword(){
  const chars = "ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789";
  let pass = "";
  for(let i = 0; i < 8; i++){
    pass += chars.charAt(Math.floor(Math.random() * chars.length));
  }
  return pass;
}

function regenerateStudentUsername(){
  const nameField = document.getElementById("accName");

  const rand = Math.floor(100 + Math.random() * 900);
  emailField.value = `${initials}${rand}@fissportal.local`;

async function submitCreateAccount(context){
  const errBox = document.getElementById("accError");
  errBox.textContent = "";

  const name = document.getElementById("accName").value.trim();
  const role = document.getElementById("accRole").value;
  const email = document.getElementById("accEmail") ? document.getElementById("accEmail").value.trim() : "";
  const password = document.getElementById("accPassword") ? document.getElementById("accPassword").value : "";

  if(!name || !role || !email || !password){
    errBox.textContent = "Please fill in all fields.";
    return;
  }

  // Determine level + assignment details based on role
  let level = null;
  let classAssigned = null;
  let subjectsAssigned = null;

  if(role === "student"){
    const classField = document.getElementById("accClass");
    classAssigned = classField.value;
    if(!classAssigned){
      errBox.textContent = "Please select a class.";
      return;
    }
    level = PRIMARY_CLASSES.includes(classAssigned) ? "primary" : "secondary";
  } else if(role === "teacher"){
    const grid = document.getElementById("teacherClassGrid");
    const checked = [...grid.querySelectorAll("input:checked")];
    if(checked.length === 0){
      errBox.textContent = "Please select at least one class.";
      return;
    }
    const levels = new Set(checked.map(c => c.dataset.level));
    if(levels.size > 1){
      errBox.textContent = "A teacher account must be assigned within one level only.";
      return;
    }
    classAssigned = checked.map(c => c.value);
    level = [...levels][0];

    const subjectGrid = document.getElementById("teacherSubjectGrid");
    const checkedSubjects = [...subjectGrid.querySelectorAll("input:checked")];
    if(checkedSubjects.length === 0){
      errBox.textContent = "Please select at least one subject.";
      return;
    }
    subjectsAssigned = checkedSubjects.map(s => s.value);
  } else if(role === "cashier"){
    const levelField = document.getElementById("accLevel");
    level = levelField.value;
  } else if(role === "primary_admin"){
    level = "primary";
  } else if(role === "secondary_admin"){
    level = "secondary";
  } else if(role === "general_admin"){
    level = "both";
  }

  try{
    // Create the auth account using the SECONDARY app instance,
    // so the current admin's own session is untouched.
    const cred = await secondaryAuth.createUserWithEmailAndPassword(email, password);
    const uid = cred.user.uid;
    await secondaryAuth.signOut();

    const profileData = {
      name: name,
      email: email,
      role: role,
      level: level,
      createdAt: new Date().toISOString(),
      createdBy: currentUser.uid
    };
    if(classAssigned) profileData.class = classAssigned;
    if(subjectsAssigned) profileData.subjects = subjectsAssigned;

    await db.collection("users").doc(uid).set(profileData);

    showCredentials({ name, email, password, role, level, classAssigned, subjectsAssigned });
    closeAccountModal();
  } catch(e){
    errBox.textContent = "Error: " + e.message;
  }
}

    <div class="section-title" style="margin-top:12px;">Add Students in Bulk</div>
    <div class="form-group">
      <label>Class</label>

        <option value="">Select class...</option>
        ${classOptionsHTML(lockedLevel)}
      </select>
    </div>
    <div class="form-group">
      <label>Student Names (one per line)</label>
      <textarea id="bulkNames" rows="10" style="width:100%; padding:10px 12px; border:1px solid var(--gray-line); border-radius:8px; font-size:14px;" placeholder="Musa Ibrahim
Amaka Obi
Chidi Eze"></textarea>
      <small style="color:#666;">Each line becomes one student account. Usernames and passwords are generated automatically, same as single account creation.</small>
    </div>
    <button class="btn-primary" onclick="submitBulkAddStudents()">Create Accounts</button>
    <div class="field-error" id="bulkError"></div>
    <div id="bulkProgressArea" style="margin-top:16px;"></div>
  `;
}

function bulkGenerateUsername(name, taken){
  const clean = (name || "student").trim().toLowerCase().replace(/[^a-z]/g, "");
  const initials = clean.slice(0, 6) || "student";
  let username;
  do {
    const rand = Math.floor(100 + Math.random() * 900);
    username = `${initials}${rand}@fissportal.local`;
  } while(taken.has(username));
  taken.add(username);
  return username;
}

async function submitBulkAddStudents(){
  const errBox = document.getElementById("bulkError");
  const progressArea = document.getElementById("bulkProgressArea");
  errBox.textContent = "";

  const classAssigned = document.getElementById("bulkClass").value;
  const rawNames = document.getElementById("bulkNames").value
    .split("\n").map(n => n.trim()).filter(n => n.length > 0);

  if(!classAssigned){
    errBox.textContent = "Please select a class.";
    return;
  }
  if(rawNames.length === 0){
    errBox.textContent = "Enter at least one student name.";
    return;
  }

  const level = PRIMARY_CLASSES.includes(classAssigned) ? "primary" : "secondary";
  const usedUsernames = new Set();
  const results = []; // { name, username, password, status: "ok"|"error", message? }

  progressArea.innerHTML = `<div class="placeholder-note">Creating accounts: 0 / ${rawNames.length}...</div>`;

  for(let i = 0; i < rawNames.length; i++){
    const name = rawNames[i];
    const username = bulkGenerateUsername(name, usedUsernames);
    const password = generatePassword();

    try{
      const cred = await secondaryAuth.createUserWithEmailAndPassword(username, password);
      const uid = cred.user.uid;
      await secondaryAuth.signOut();

      await db.collection("users").doc(uid).set({
        name, email: username, role: "student", level, class: classAssigned,
        createdAt: new Date().toISOString(), createdBy: currentUser.uid
      });

      results.push({ name, username, password, status: "ok" });
    } catch(e){
      results.push({ name, username, password, status: "error", message: e.message });
    }

    progressArea.innerHTML = `<div class="placeholder-note">Creating accounts: ${i + 1} / ${rawNames.length}...</div>`;
  }

  renderBulkResults(results, classAssigned);
}

function renderBulkResults(results, classAssigned){
  const progressArea = document.getElementById("bulkProgressArea");
  const okRows = results.filter(r => r.status === "ok");
  const errorRows = results.filter(r => r.status === "error");

  const rowHTML = (r) => `
    <div class="cred-row"><span class="k">${r.name}</span><span class="v">${r.username} · ${r.password}</span></div>
  `;

  progressArea.innerHTML = `
    <div class="section-title" style="margin-top:0;">Done — ${okRows.length} of ${results.length} created</div>
    ${errorRows.length > 0 ? `
      <div class="field-error" style="margin-bottom:10px;">
        ${errorRows.length} failed: ${errorRows.map(r => `${r.name} (${r.message})`).join("; ")}
      </div>
    ` : ""}
    ${okRows.length > 0 ? `
      <div class="cred-warning">Save or share these now — passwords cannot be retrieved again later.</div>
      <div style="margin-top:10px;">${okRows.map(rowHTML).join("")}</div>
      <button class="btn-secondary" onclick='printBulkResults(${JSON.stringify(okRows)}, ${JSON.stringify(classAssigned)})'>🖨️ Print List</button>
    ` : ""}
    <button class="btn-primary" style="margin-top:14px;" onclick="openManageAccounts('${manageAccountsContext}')">Back to Manage Accounts</button>
  `;
}

function printBulkResults(okRows, classAssigned){
  const rows = okRows.map(r => `<tr><td>${r.name}</td><td>${r.username}</td><td>${r.password}</td></tr>`).join("");

  openPrintWindow(`
    <div style="text-align:center; margin-bottom:14px;">
      <h2 style="margin:0;">Faith International School, Itobe</h2>
      <div style="font-style:italic;">"In God We Trust"</div>
      <div style="margin-top:8px; font-weight:600;">New Student Logins — ${classAssigned}</div>
      <div style="font-size:12px; color:#555;">Generated: ${new Date().toLocaleDateString()}</div>
    </div>
    <table>
      <thead><tr><th>Name</th><th>Username</th><th>Password</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `);
}

      db.collection("users").where("role","==","student").get(),

      db.collection("fees").get()

      .get();

/* ============================================================
   REPORT CARDS — Admin picks a class/term/session, sees every

============================================================ */
function openReportCards(level){
  const main = document.getElementById("mainContent");
  const classList = classListForLevel(level);

// Prevents printing stale data: if Class/Term/Session is changed after a
// class was loaded, the old results (and their print buttons) are cleared
// until "Load Class" is tapped again for the new selection.
function resetReportCardResults(){
  currentReportCards = [];
  const area = document.getElementById("rcResultsArea");
  if(area) area.innerHTML = `<div class="placeholder-note">Selection changed — tap "Load Class" to load results for the new selection.</div>`;
}

let currentReportCards = []; // [{ uid, name, class, subjects: [...], average, position }]

async function loadReportCardClass(level){
  const errBox = document.getElementById("rcError");
  const area = document.getElementById("rcResultsArea");
  errBox.textContent = "";

  const cls = document.getElementById("rcClass").value;
  const term = document.getElementById("rcTerm").value;
  const session = document.getElementById("rcSession").value.trim();

  if(!session){
    errBox.textContent = "Please enter the session.";
    return;
  }

  area.innerHTML = `<div class="placeholder-note">Loading...</div>`;

  try{
    const [studentSnap, resultsSnap] = await Promise.all([
      db.collection("users").where("role","==","student").where("class","==",cls).get(),
      db.collection("results").where("class","==",cls).where("term","==",term)
        .where("session","==",session).where("status","==","generated").get()
    ]);

    let students = [];
    studentSnap.forEach(doc => students.push({ uid: doc.id, name: doc.data().name || "(no name)" }));
    students.sort((a,b) => a.name.localeCompare(b.name));

    let resultsByStudent = {};
    resultsSnap.forEach(doc => {
      const d = doc.data();
      if(!resultsByStudent[d.studentUid]) resultsByStudent[d.studentUid] = [];
      resultsByStudent[d.studentUid].push(d);
    });

    currentReportCards = students.map(s => {
      const subjects = (resultsByStudent[s.uid] || []).sort((a,b) => a.subject.localeCompare(b.subject));
      const average = subjects.length > 0
        ? Math.round((subjects.reduce((sum, r) => sum + (r.total || 0), 0) / subjects.length) * 10) / 10
        : null;
      return { uid: s.uid, name: s.name, class: cls, term, session, level, subjects, average };
    });

    // Rank by average, only among students who actually have results
    const ranked = currentReportCards.filter(r => r.average !== null).sort((a,b) => b.average - a.average);
    ranked.forEach((r, i) => { r.position = i + 1; });

    renderReportCardList(cls, term, session);
  } catch(e){
    area.innerHTML = `<div class="field-error">Error loading class: ${e.message}</div>`;
  }
}

function renderReportCardList(cls, term, session){
  const area = document.getElementById("rcResultsArea");

  if(currentReportCards.length === 0){
    area.innerHTML = `<div class="placeholder-note">No students found in ${cls}.</div>`;
    return;
  }

  const rows = currentReportCards.map((r, i) => `
    <div style="display:flex; justify-content:space-between; align-items:center; border:1px solid var(--gray-line); border-radius:8px; padding:10px 14px; margin-bottom:8px; gap:10px;">
      <div>
        <div style="font-weight:600;">${r.name}</div>
        <div style="font-size:12px; color:#666;">
          ${r.subjects.length === 0 ? "No finalized results yet" : `${r.subjects.length} subject${r.subjects.length === 1 ? "" : "s"} · Avg ${r.average}${r.position ? " · Position " + r.position : ""}`}
        </div>
      </div>
      <button class="btn-secondary" style="width:auto; margin:0;" ${r.subjects.length === 0 ? "disabled" : ""} onclick="printReportCard(${i})">🖨️ Print</button>
    </div>
  `).join("");

  area.innerHTML = `
    <button class="btn-secondary" onclick="printAllReportCards()">🖨️ Print Whole Class</button>
    <div style="margin-top:10px;">${rows}</div>
  `;
}

/* ============================================================
   MASTER LIST — one broadsheet: every student as a row, every
   subject as a column, with Grand Total / Average / Position.
   Uses finalized (status:"generated") results only, same as
   Report Cards, so the two always agree.
============================================================ */
function openMasterList(level){
  const main = document.getElementById("mainContent");
  const classList = classListForLevel(level);

  main.innerHTML = `
    <button class="btn-secondary" onclick="renderDashboard()">&larr; Back to Dashboard</button>
    <div class="section-title" style="margin-top:12px;">Master List</div>
    <div class="form-group">
      <label>Class</label>
      <select id="mlClass" onchange="resetMasterList()">${classList.map(c => `<option value="${c}">${c}</option>`).join("")}</select>
    </div>
    <div class="form-group">
      <label>Term</label>
      <select id="mlTerm" onchange="resetMasterList()">${TERMS.map(t => `<option value="${t}">${t}</option>`).join("")}</select>
    </div>
    <div class="form-group">
      <label>Session</label>
      <input type="text" id="mlSession" value="${defaultSession || ""}" placeholder="e.g. 2025/2026" onchange="resetMasterList()">
    </div>
    <button class="btn-primary" onclick="loadMasterList('${level}')">Load Master List</button>
    <div class="field-error" id="mlError"></div>
    <div id="mlResultsArea" style="margin-top:16px;"></div>
  `;
}

function resetMasterList(){
  currentMasterList = null;
  const area = document.getElementById("mlResultsArea");
  if(area) area.innerHTML = `<div class="placeholder-note">Selection changed — tap "Load Master List" to reload.</div>`;
}

let currentMasterList = null; // { cls, term, session, level, subjects: [...], rows: [...] }

async function loadMasterList(level){
  const errBox = document.getElementById("mlError");
  const area = document.getElementById("mlResultsArea");
  errBox.textContent = "";

  const cls = document.getElementById("mlClass").value;
  const term = document.getElementById("mlTerm").value;
  const session = document.getElementById("mlSession").value.trim();

  if(!session){
    errBox.textContent = "Please enter the session.";
    return;
  }

  area.innerHTML = `<div class="placeholder-note">Loading...</div>`;

  try{
    const [studentSnap, resultsSnap] = await Promise.all([
      db.collection("users").where("role","==","student").where("class","==",cls).get(),
      db.collection("results").where("class","==",cls).where("term","==",term)
        .where("session","==",session).where("status","==","generated").get()
    ]);

    let students = [];
    studentSnap.forEach(doc => students.push({ uid: doc.id, name: doc.data().name || "(no name)" }));
    students.sort((a,b) => a.name.localeCompare(b.name));

    let resultsByStudent = {};
    const subjectSet = new Set();
    resultsSnap.forEach(doc => {
      const d = doc.data();
      subjectSet.add(d.subject);
      if(!resultsByStudent[d.studentUid]) resultsByStudent[d.studentUid] = {};
      resultsByStudent[d.studentUid][d.subject] = d;
    });

    const subjects = Array.from(subjectSet).sort();

    let rows = students.map(s => {
      const scores = resultsByStudent[s.uid] || {};
      const subjectTotals = subjects.map(subj => scores[subj] ? scores[subj].total : null);
      const scored = subjectTotals.filter(t => t !== null);
      const grandTotal = scored.reduce((sum, t) => sum + t, 0);
      const average = scored.length > 0 ? Math.round((grandTotal / scored.length) * 10) / 10 : null;
      return { name: s.name, subjectTotals, grandTotal, average };
    });

    const ranked = rows.filter(r => r.average !== null).sort((a,b) => b.average - a.average);
    ranked.forEach((r, i) => { r.position = i + 1; });

    currentMasterList = { cls, term, session, level, subjects, rows };
    renderMasterList();
  } catch(e){
    area.innerHTML = `<div class="field-error">Error loading master list: ${e.message}</div>`;
  }
}

function renderMasterList(){
  const area = document.getElementById("mlResultsArea");
  const { cls, term, session, subjects, rows } = currentMasterList;

  if(rows.length === 0){
    area.innerHTML = `<div class="placeholder-note">No students found in ${cls}.</div>`;
    return;
  }
  if(subjects.length === 0){
    area.innerHTML = `<div class="placeholder-note">No finalized results yet for ${cls} · ${term} · ${session}.</div>`;
    return;
  }

  const headerCells = subjects.map(s => `<th style="padding:5px 4px; border:1px solid var(--gray-line);">${s}</th>`).join("");
  const bodyRows = rows.map(r => `
    <tr>
      <td style="padding:5px 6px; border:1px solid var(--gray-line); text-align:left;">${r.name}</td>
      ${r.subjectTotals.map(t => `<td style="padding:5px 4px; border:1px solid var(--gray-line); text-align:center;">${t === null ? "—" : t}</td>`).join("")}
      <td style="padding:5px 4px; border:1px solid var(--gray-line); text-align:center; font-weight:700;">${r.grandTotal}</td>
      <td style="padding:5px 4px; border:1px solid var(--gray-line); text-align:center; font-weight:700;">${r.average === null ? "—" : r.average}</td>
      <td style="padding:5px 4px; border:1px solid var(--gray-line); text-align:center; font-weight:700;">${r.position || "—"}</td>
    </tr>
  `).join("");

  area.innerHTML = `
    <button class="btn-secondary" onclick="printMasterList()">🖨️ Print Master List</button>
    <div class="placeholder-note" style="margin-top:8px;">Wide classes print best in Landscape — you can switch orientation in the print dialog.</div>
    <div style="overflow-x:auto; margin-top:10px;">
      <table style="border-collapse:collapse; font-size:12px; white-space:nowrap;">
        <thead>
          <tr style="background:var(--gray-bg);">
            <th style="padding:5px 6px; border:1px solid var(--gray-line); text-align:left;">Student</th>
            ${headerCells}
            <th style="padding:5px 4px; border:1px solid var(--gray-line);">Total</th>
            <th style="padding:5px 4px; border:1px solid var(--gray-line);">Avg</th>
            <th style="padding:5px 4px; border:1px solid var(--gray-line);">Pos</th>
          </tr>
        </thead>
        <tbody>${bodyRows}</tbody>
      </table>
    </div>
  `;
}

function printMasterList(){
  const { cls, term, session, subjects, rows } = currentMasterList;

  const headerCells = subjects.map(s => `<th>${s}</th>`).join("");
  const bodyRows = rows.map(r => `
    <tr>
      <td style="text-align:left;">${r.name}</td>
      ${r.subjectTotals.map(t => `<td>${t === null ? "—" : t}</td>`).join("")}
      <td><strong>${r.grandTotal}</strong></td>
      <td><strong>${r.average === null ? "—" : r.average}</strong></td>
      <td><strong>${r.position || "—"}</strong></td>
    </tr>
  `).join("");

  openPrintWindow(`
    <div style="text-align:center; margin-bottom:14px;">
      <h2 style="margin:0;">Faith International School, Itobe</h2>
      <div style="font-style:italic;">"In God We Trust"</div>
      <div style="margin-top:8px; font-weight:700;">Master List of Results — ${cls} · ${term} · ${session}</div>
      <div style="font-size:11px; color:#555;">Printed: ${new Date().toLocaleDateString()}</div>
    </div>
    <table style="font-size:11px;">
      <thead><tr><th>Student</th>${headerCells}<th>Total</th><th>Avg</th><th>Pos</th></tr></thead>
      <tbody>${bodyRows}</tbody>
    </table>
  `);
}
</script>
