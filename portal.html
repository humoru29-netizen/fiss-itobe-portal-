<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faith International School, Itobe — Portal</title>

<!-- ============================================================
  FAITH INTERNATIONAL SCHOOL, ITOBE — SCHOOL PORTAL
  Single-file HTML + Firebase (Auth + Firestore)
  Structure:
    1. General Admin  -> oversees BOTH Primary and Secondary
    2. Primary Admin   -> manages Primary level only
    3. Secondary Admin -> manages Secondary level only
    4. Teacher / Student / Cashier -> routed to their level

  FIRESTORE SCHEMA (create these collections):
    users/{uid}          { name, role, level, email }
        role: "general_admin" | "primary_admin" | "secondary_admin"
              | "teacher" | "student" | "cashier"
        level: "primary" | "secondary" | "both"  (General Admin = "both")

    students/{id}        { name, level, class, admissionNo, ... }
    teachers/{id}         { name, level, subjects, classes, ... }
    results/{id}          { studentId, level, subject, ca1, ca2, exam, term, session }
    fees/{id}              { studentId, level, amountPaid, balance, term }
    announcements/{id}   { title, body, level, date }  level:"both" = all
  ============================================================ -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root{
    --maroon:#6B0F1A;
    --maroon-dark:#4d0a13;
    --black:#111111;
    --white:#ffffff;
    --gray-bg:#f4f2f0;
    --gray-line:#e2ddd8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--gray-bg);
    color: var(--black);
    min-height:100vh;
  }
  /* subtle horseback-check motif strip */
  .check-strip{
    height:8px;
    width:100%;
    background: repeating-linear-gradient(45deg, var(--maroon) 0 10px, var(--black) 10px 20px);
  }
  .hidden{ display:none !important; }

  /* ---------- LOGIN SCREEN ---------- */
  #loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: linear-gradient(180deg, var(--white) 0%, var(--gray-bg) 100%);
    padding:20px;
  }
  .login-card{
    background:var(--white);
    border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,0.12);
    max-width:380px;
    width:100%;
    overflow:hidden;
    border:1px solid var(--gray-line);
  }
  .login-header{
    background:var(--maroon);
    color:var(--white);
    text-align:center;
    padding:28px 20px 20px;
  }
  .crest{
    width:64px; height:64px;
    margin:0 auto 10px;
  }
  .login-header h1{
    font-size:18px;
    letter-spacing:0.5px;
  }
  .login-header p{
    font-size:12px;
    opacity:0.9;
    margin-top:4px;
    font-style:italic;
  }
  .login-body{ padding:24px 24px 28px; }
  .login-body label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin:14px 0 6px;
    color:var(--black);
  }
  .login-body input{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--gray-line);
    border-radius:8px;
    font-size:15px;
  }
  .login-body input:focus{
    outline:none;
    border-color:var(--maroon);
  }
  #loginBtn{
    width:100%;
    margin-top:20px;
    padding:12px;
    background:var(--maroon);
    color:var(--white);
    border:none;
    border-radius:8px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  #loginBtn:active{ background:var(--maroon-dark); }
  #loginError{
    color:var(--maroon);
    font-size:13px;
    margin-top:12px;
    text-align:center;
    min-height:16px;
  }
  .login-footer{
    text-align:center;
    font-size:11px;
    color:#888;
    padding:14px;
    border-top:1px solid var(--gray-line);
  }

  /* ---------- APP SHELL ---------- */
  #appShell{ min-height:100vh; }
  header.topbar{
    background:var(--maroon);
    color:var(--white);
    padding:14px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
  }
  .topbar-left{ display:flex; align-items:center; gap:10px; }
  .topbar-left .crest-sm{ width:34px; height:34px; }
  .topbar-left h2{ font-size:15px; line-height:1.2; }
  .topbar-left span{ display:block; font-size:11px; opacity:0.85; font-style:italic; }
  .badge{
    background:rgba(255,255,255,0.15);
    padding:4px 10px;
    border-radius:20px;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.3px;
  }
  #logoutBtn{
    background:var(--white);
    color:var(--maroon);
    border:none;
    padding:8px 14px;
    border-radius:6px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }

  .level-switch{
    display:flex;
    gap:8px;
    padding:12px 18px;
    background:var(--white);
    border-bottom:1px solid var(--gray-line);
  }
  .level-switch button{
    flex:1;
    padding:10px;
    border:1px solid var(--gray-line);
    background:var(--gray-bg);
    border-radius:8px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    color:var(--black);
  }
  .level-switch button.active{
    background:var(--maroon);
    color:var(--white);
    border-color:var(--maroon);
  }

  main{ padding:18px; max-width:900px; margin:0 auto; }
  .section-title{
    font-size:16px;
    font-weight:700;
    color:var(--maroon);
    margin:20px 0 10px;
    padding-bottom:6px;
    border-bottom:2px solid var(--maroon);
  }
  .section-title:first-child{ margin-top:0; }

  .card-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px,1fr));
    gap:12px;
  }
  .tile{
    background:var(--white);
    border:1px solid var(--gray-line);
    border-radius:10px;
    padding:16px 12px;
    text-align:center;
    cursor:pointer;
    transition:transform 0.1s;
  }
  .tile:active{ transform:scale(0.97); background:var(--gray-bg); }
  .tile .icon{ font-size:26px; margin-bottom:8px; }
  .tile .label{ font-size:12.5px; font-weight:600; color:var(--black); }

  .stat-row{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(110px,1fr));
    gap:10px;
    margin-bottom:16px;
  }
  .stat-box{
    background:var(--white);
    border:1px solid var(--gray-line);
    border-left:4px solid var(--maroon);
    border-radius:8px;
    padding:12px 14px;
  }
  .stat-box .num{ font-size:22px; font-weight:700; color:var(--maroon); }
  .stat-box .lbl{ font-size:11.5px; color:#555; margin-top:2px; }

  .placeholder-note{
    background:#fff8e6;
    border:1px solid #f0d98c;
    color:#7a5c00;
    font-size:12.5px;
    padding:10px 12px;
    border-radius:8px;
    margin-top:10px;
  }

  footer.foot{
    text-align:center;
    font-size:11px;
    color:#999;
    padding:24px 10px 30px;
  }

  /* ---------- MODAL ---------- */
  .modal-overlay{
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,0.5);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:1000;
  }
  .modal-box{
    background:var(--white);
    width:100%;
    max-width:480px;
    max-height:90vh;
    overflow-y:auto;
    border-radius:16px 16px 0 0;
    padding-bottom:20px;
  }
  .modal-header{
    background:var(--maroon);
    color:var(--white);
    padding:16px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    border-radius:16px 16px 0 0;
  }
  .modal-header h3{ font-size:16px; }
  .modal-close{
    background:none;
    border:none;
    color:var(--white);
    font-size:22px;
    cursor:pointer;
    line-height:1;
  }
  .modal-body{ padding:18px; }
  .form-group{ margin-bottom:14px; }
  .form-group label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin-bottom:6px;
  }
  .form-group input,
  .form-group select{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--gray-line);
    border-radius:8px;
    font-size:14px;
    background:var(--white);
  }
  .form-row{ display:flex; gap:10px; }
  .form-row .form-group{ flex:1; }
  .checkbox-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:8px;
    max-height:180px;
    overflow-y:auto;
    border:1px solid var(--gray-line);
    border-radius:8px;
    padding:10px;
  }
  .checkbox-grid label{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    font-weight:400;
  }
  .btn-primary{
    width:100%;
    padding:12px;
    background:var(--maroon);
    color:var(--white);
    border:none;
    border-radius:8px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    margin-top:6px;
  }
  .btn-secondary{
    width:100%;
    padding:10px;
    background:var(--gray-bg);
    color:var(--black);
    border:1px solid var(--gray-line);
    border-radius:8px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    margin-top:8px;
  }
  .field-error{
    color:var(--maroon);
    font-size:12.5px;
    margin-top:8px;
    min-height:16px;
  }
  .cred-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid var(--gray-line);
  }
  .cred-row .k{ font-size:12.5px; color:#666; }
  .cred-row .v{ font-size:14px; font-weight:600; }
  .cred-warning{
    background:#fff8e6;
    border:1px solid #f0d98c;
    color:#7a5c00;
    font-size:12.5px;
    padding:10px 12px;
    border-radius:8px;
    margin-top:14px;
  }
  #printArea{ display:none; }
  @media print{
    body.printing > *:not(#printArea){ display:none !important; }
    body.printing #printArea{ display:block !important; }
    #printArea table{ width:100%; border-collapse:collapse; }
    #printArea th, #printArea td{ border:1px solid #000; padding:6px 8px; text-align:left; font-size:13px; }
  }
</style>
</head>

        <path d="M32 4 L56 14 V30 C56 46 46 56 32 60 C18 56 8 46 8 30 V14 Z" stroke="#ffffff" stroke-width="2"/>

<div id="accountModal" class="modal-overlay hidden">

    <div class="modal-body" id="credentialsBody"></div>

</div>

<div id="printArea"></div>

<script>
/* ============================================================
   FIREBASE CONFIG
   Replace with your own Firebase project keys before deploying.
   Create a SEPARATE Firebase project from FISSI Connect.
============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyBhSTNPcF8jd9XJ_J2cPCuedbaAYp58X5I",
  authDomain: "fiss-itobe-portal.firebaseapp.com",
  projectId: "fiss-itobe-portal",
  storageBucket: "fiss-itobe-portal.firebasestorage.app",
  messagingSenderId: "655933896387",
  appId: "1:655933896387:web:9e6df2097afc1948469476"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// Secondary Firebase app instance — used ONLY for creating new accounts,
// so that creating a user doesn't log the admin out of their own session.
const secondaryApp = firebase.initializeApp(firebaseConfig, "Secondary");
const secondaryAuth = secondaryApp.auth();

const PRIMARY_CLASSES = ["Nursery 1","Nursery 2","Primary 1","Primary 2","Primary 3","Primary 4","Primary 5","Primary 6"];
const SECONDARY_CLASSES = ["JSS 1","JSS 2","JSS 3","SS 1","SS 2","SS 3"];
const PRIMARY_SUBJECTS = ["Mathematics","English","Basic Science","Social Studies","Civic Education","Agricultural Science","CRK/IRK","Handwriting","Verbal Reasoning","Quantitative Reasoning"];
const SECONDARY_SUBJECTS = ["Mathematics","English","Basic Science","Civic Education","Social Studies","Agricultural Science","Business Studies","French","CRK/IRK","Computer Studies","Physics","Chemistry","Biology","Government","Economics","Literature","Geography"];

const TERMS = ["First Term","Second Term","Third Term"];

function termOptionsHTML(){
  return TERMS.map(t => `<option value="${t}" ${t === defaultTerm ? "selected" : ""}>${t}</option>`).join("");
}

async function loadPortalSettings(){
  try{
    const doc = await db.collection("settings").doc("current").get();
    if(doc.exists){
      const d = doc.data();
      defaultTerm = d.term || "";
      defaultSession = d.session || "";
    }
  } catch(e){
    // Non-critical — forms just fall back to blank/first option if this fails.
  }
}

function waecGrade(total){
  if(total >= 75) return { grade: "A1", remark: "Excellent" };
  if(total >= 70) return { grade: "B2", remark: "Very Good" };
  if(total >= 65) return { grade: "B3", remark: "Good" };
  if(total >= 60) return { grade: "C4", remark: "Credit" };
  if(total >= 55) return { grade: "C5", remark: "Credit" };
  if(total >= 50) return { grade: "C6", remark: "Credit" };
  if(total >= 45) return { grade: "D7", remark: "Pass" };
  if(total >= 40) return { grade: "E8", remark: "Pass" };
  return { grade: "F9", remark: "Fail" };
}

function resultDocId(studentUid, subject, term, session){
  const clean = s => String(s).trim().replace(/[^a-zA-Z0-9]+/g, "_");
  return `${studentUid}_${clean(subject)}_${clean(term)}_${clean(session)}`;
}

let currentUser = null;   // Firebase auth user
let currentProfile = null; // Firestore users/{uid} doc: {name, role, level}
let generalAdminView = "overview"; // "primary" | "secondary" | "overview"
let manageAccountsContext = "general"; // "general" | "primary" | "secondary"
let editingUid = null;
let resultsApprovalContext = "general"; // "general" | "primary" | "secondary"
let currentResultsBatch = []; // rows currently loaded in teacher-entry or admin-approval screen
let feeManagerContext = "cashier"; // "cashier" | "primary" | "secondary" | "general"
let currentFeeBatch = [];
let defaultTerm = "";
let defaultSession = "";

/* ---------------- LOGIN / LOGOUT ---------------- */
function handleLogin(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const errBox = document.getElementById("loginError");
  errBox.textContent = "";

  if(!email || !password){
    errBox.textContent = "Please enter both email and password.";
    return;
  }

  document.getElementById("loginBtn").textContent = "Logging in...";

  auth.signInWithEmailAndPassword(email, password)
    .catch(err => {
      errBox.textContent = "Login failed: " + err.message;
      document.getElementById("loginBtn").textContent = "Log In";
    });
}

function handleLogout(){
  auth.signOut();
}

/* ============================================================
   AUTO LOG-OUT ON INACTIVITY
   Logs the user out after IDLE_TIMEOUT_MS of no touch/click/scroll/key
   activity, so a shared or unattended phone doesn't stay signed into
   an Admin account indefinitely.
============================================================ */
const IDLE_TIMEOUT_MS = 15 * 60 * 1000; // 15 minutes
let lastActivityAt = Date.now();

["click","touchstart","keydown","scroll","mousemove"].forEach(evt => {
  document.addEventListener(evt, () => { lastActivityAt = Date.now(); }, { passive: true });
});

setInterval(() => {
  if(currentUser && (Date.now() - lastActivityAt) >= IDLE_TIMEOUT_MS){
    handleLogout();
    alert("You've been logged out after 15 minutes of inactivity.");
  }
}, 30 * 1000); // check every 30 seconds

auth.onAuthStateChanged(async (user) => {
  if(user){
    currentUser = user;
    await loadUserProfile(user.uid);
  } else {
    currentUser = null;
    currentProfile = null;
    document.getElementById("loginScreen").classList.remove("hidden");
    document.getElementById("appShell").classList.add("hidden");
    document.getElementById("loginBtn").textContent = "Log In";
  }
});

async function loadUserProfile(uid){
  try{
    const doc = await db.collection("users").doc(uid).get();
    if(!doc.exists){
      document.getElementById("loginError").textContent =
        "No profile found for this account. Contact General Admin.";
      auth.signOut();
      return;
    }
    currentProfile = doc.data(); // { name, role, level, email }
    loadPortalSettings();
    enterPortal();
  } catch(e){
    document.getElementById("loginError").textContent = "Error loading profile: " + e.message;
    document.getElementById("loginBtn").textContent = "Log In";
  }
}

/* ---------------- ROUTING ---------------- */
function enterPortal(){
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("appShell").classList.remove("hidden");

  document.getElementById("userNameBadge").textContent = currentProfile.name || currentUser.email;
  document.getElementById("userRoleLabel").textContent = roleLabel(currentProfile.role);

  const levelSwitch = document.getElementById("levelSwitch");
  if(currentProfile.role === "general_admin"){
    levelSwitch.classList.remove("hidden");
    generalAdminView = "overview";
    highlightViewButton();
  } else {
    levelSwitch.classList.add("hidden");
  }

  renderDashboard();
}

function roleLabel(role){
  return {
    general_admin: "General Admin — Oversees Primary & Secondary",
    primary_admin: "Primary Admin",
    secondary_admin: "Secondary Admin",
    teacher: "Teacher",
    student: "Student",
    cashier: "Cashier"
  }[role] || role;
}

function setGeneralAdminView(view){
  generalAdminView = view;
  highlightViewButton();
  renderDashboard();
}

function highlightViewButton(){
  document.getElementById("btnPrimaryView").classList.toggle("active", generalAdminView === "primary");
  document.getElementById("btnSecondaryView").classList.toggle("active", generalAdminView === "secondary");
  document.getElementById("btnOverviewView").classList.toggle("active", generalAdminView === "overview");
}

/* ---------------- DASHBOARD RENDERING ---------------- */
function renderDashboard(){
  const main = document.getElementById("mainContent");
  const role = currentProfile.role;

  if(role === "general_admin"){
    main.innerHTML = renderGeneralAdmin(generalAdminView);
  } else if(role === "primary_admin"){
    main.innerHTML = renderLevelAdmin("Primary");
  } else if(role === "secondary_admin"){
    main.innerHTML = renderLevelAdmin("Secondary");
  } else if(role === "teacher"){
    main.innerHTML = renderTeacher();
  } else if(role === "student"){
    main.innerHTML = renderStudent();
  } else if(role === "cashier"){
    main.innerHTML = renderCashier();
  } else {
    main.innerHTML = `<p>Unknown role. Contact General Admin.</p>`;
  }
}

function renderGeneralAdmin(view){
  if(view === "overview"){
    return `
      <div class="section-title">Portal Overview — Both Levels</div>
      <div class="stat-row">
        <div class="stat-box"><div class="num">--</div><div class="lbl">Total Students (Primary)</div></div>
        <div class="stat-box"><div class="num">--</div><div class="lbl">Total Students (Secondary)</div></div>
        <div class="stat-box"><div class="num">--</div><div class="lbl">Total Teachers</div></div>
        <div class="stat-box"><div class="num">--</div><div class="lbl">Fees Outstanding</div></div>
      </div>
      <div class="section-title">General Admin Tools</div>
      <div class="card-grid">
        <div class="tile" onclick="openLeadershipDirectory()">
          <div class="icon">👥</div>
          <div class="label">Leadership Directory</div>

async function openEditAccountModal(uid){

  body.innerHTML = `<div class="placeholder-note">Loading...</div>`;
  modal.classList.remove("hidden");

  try{
    docSnap = await db.collection("users").doc(uid).get();
  } catch(e){
    body.innerHTML = `<div class="field-error">Error loading account: ${e.message}</div>`;
    return;
  }
  if(!docSnap.exists){
    body.innerHTML = `<div class="field-error">Account not found. It may have already been removed.</div>`;
    return;
  }
  const data = docSnap.data();

  let assignmentHTML = "";
  if(data.role === "teacher"){
    const level = data.level;
    const classList = level === "secondary" ? SECONDARY_CLASSES : level === "primary" ? PRIMARY_CLASSES : [...PRIMARY_CLASSES, ...SECONDARY_CLASSES];

    const currentClasses = Array.isArray(data.class) ? data.class : (data.class ? [data.class] : []);

        <label>Classes Taught</label>
        <div class="checkbox-grid" id="editClassGrid">
          ${classList.map(c => `<label><input type="checkbox" value="${c}" ${currentClasses.includes(c) ? "checked" : ""}> ${c}</label>`).join("")}
        </div>
      </div>
      <div class="form-group">
        <label>Subjects Taught</label>
        <div class="checkbox-grid" id="editSubjectGrid">
          ${subjectList.map(s => `<label><input type="checkbox" value="${s}" ${currentSubjects.includes(s) ? "checked" : ""}> ${s}</label>`).join("")}
        </div>
      </div>
    `;
  } else if(data.role === "student"){
    const classList = data.level === "primary" ? PRIMARY_CLASSES : SECONDARY_CLASSES;
    assignmentHTML = `
      <div class="form-group">
        <label>Class</label>
        <select id="editClass">
          ${classList.map(c => `<option value="${c}" ${c === data.class ? "selected" : ""}>${c}</option>`).join("")}
        </select>
      </div>
    `;
  } else if(data.role === "cashier"){
    assignmentHTML = `
      <div class="form-group">
        <label>Assigned Level</label>
        <select id="editLevel">
          <option value="both" ${data.level === "both" ? "selected" : ""}>Both Levels</option>
          <option value="primary" ${data.level === "primary" ? "selected" : ""}>Primary Only</option>
          <option value="secondary" ${data.level === "secondary" ? "selected" : ""}>Secondary Only</option>
        </select>
      </div>
    `;
  }

  body.innerHTML = `
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="editName" value="${(data.name || "").replace(/"/g,"&quot;")}">
    </div>
    <div class="placeholder-note">Role: ${roleLabel(data.role)} — email and password cannot be changed here.</div>
    ${assignmentHTML}
    <div class="field-error" id="editError"></div>
    <button class="btn-primary" onclick="submitEditAccount()">Save Changes</button>
  `;
}

async function submitEditAccount(){
  const errBox = document.getElementById("editError");
  errBox.textContent = "";

  const name = document.getElementById("editName").value.trim();
  if(!name){
    errBox.textContent = "Name is required.";
    return;
  }

  const updates = { name };

  const classGrid = document.getElementById("editClassGrid");
  const subjectGrid = document.getElementById("editSubjectGrid");
  const classSelect = document.getElementById("editClass");
  const levelSelect = document.getElementById("editLevel");

  if(classGrid){
    const checkedClasses = [...classGrid.querySelectorAll("input:checked")].map(c => c.value);
    if(checkedClasses.length === 0){
      errBox.textContent = "Please select at least one class.";
      return;
    }
    updates.class = checkedClasses;
  }
  if(subjectGrid){
    const checkedSubjects = [...subjectGrid.querySelectorAll("input:checked")].map(s => s.value);
    if(checkedSubjects.length === 0){
      errBox.textContent = "Please select at least one subject.";
      return;
    }
    updates.subjects = checkedSubjects;
  }
  if(classSelect){
    updates.class = classSelect.value;
  }
  if(levelSelect){
    updates.level = levelSelect.value;
  }

  try{
    await db.collection("users").doc(editingUid).update(updates);
    closeAccountModal();
    openManageAccounts(manageAccountsContext);
  } catch(e){
    errBox.textContent = "Error saving: " + e.message;
  }
}

async function removeAccountConfirm(uid, name){
  if(!confirm(`Remove ${name}'s account? This immediately blocks their portal login. This cannot be undone from here.`)) return;
  try{
    await db.collection("users").doc(uid).delete();
    openManageAccounts(manageAccountsContext);
  } catch(e){
    alert("Error removing account: " + e.message);
  }
}

/* ============================================================
   RESULTS WORKFLOW
   Stage 1: Teacher submits scores (status: "submitted")
   Stage 2: Admin generates/finalizes (status: "generated")
   Stage 3: Admin releases per student (released: true), or withholds (withheld: true)
   Students only ever see results where released === true.
   Result doc id: `${studentUid}_${subject}_${term}_${session}` (deterministic upsert)
============================================================ */

/* ---------- STAGE 1: TEACHER ENTRY ---------- */
function openEnterResults(){
  const main = document.getElementById("mainContent");
  const myClasses = Array.isArray(currentProfile.class) ? currentProfile.class : (currentProfile.class ? [currentProfile.class] : []);
  const mySubjects = currentProfile.subjects || [];

  if(myClasses.length === 0 || mySubjects.length === 0){
    main.innerHTML = `
      <button class="btn-secondary" onclick="renderDashboard()">&larr; Back to Dashboard</button>
      <div class="section-title" style="margin-top:12px;">Enter Results</div>
      <div class="placeholder-note">No classes or subjects are assigned to your account yet. Contact your Admin.</div>
    `;
    return;
  }

  main.innerHTML = `
    <button class="btn-secondary" onclick="renderDashboard()">&larr; Back to Dashboard</button>
    <div class="section-title" style="margin-top:12px;">Enter Results</div>
    <div class="form-group">
      <label>Class</label>
      <select id="rClass">${myClasses.map(c => `<option value="${c}">${c}</option>`).join("")}</select>
    </div>
    <div class="form-group">
      <label>Subject</label>
      <select id="rSubject">${mySubjects.map(s => `<option value="${s}">${s}</option>`).join("")}</select>
    </div>
    <div class="form-group">
      <label>Term</label>
      <select id="rTerm">${termOptionsHTML()}</select>
    </div>
    <div class="form-group">
      <label>Session</label>
      <input type="text" id="rSession" placeholder="e.g. 2025/2026" value="${defaultSession}">
    </div>
    <button class="btn-primary" onclick="loadStudentsForResults()">Load Students</button>
    <div class="field-error" id="rError"></div>
    <div id="rResultsArea" style="margin-top:16px;"></div>
  `;
}

async function loadStudentsForResults(){
  const errBox = document.getElementById("rError");
  errBox.textContent = "";
  const cls = document.getElementById("rClass").value;
  const subject = document.getElementById("rSubject").value;
  const term = document.getElementById("rTerm").value;
  const session = document.getElementById("rSession").value.trim();

  if(!session){
    errBox.textContent = "Please enter the session (e.g. 2025/2026).";
    return;
  }

  const area = document.getElementById("rResultsArea");
  area.innerHTML = `<div class="placeholder-note">Loading students...</div>`;

  try{
    const snap = await db.collection("users").where("role","==","student").where("class","==",cls).get();
    let students = [];
    snap.forEach(doc => students.push({ uid: doc.id, ...doc.data() }));
    students.sort((a,b) => (a.name || "").localeCompare(b.name || ""));

    if(students.length === 0){
      area.innerHTML = `<div class="placeholder-note">No students found in ${cls}.</div>`;
      currentResultsBatch = [];
      return;
    }

    // Pre-fill from any existing (not-yet-generated) results
    const existing = await Promise.all(students.map(s =>
      db.collection("results").doc(resultDocId(s.uid, subject, term, session)).get()
    ));

    currentResultsBatch = students.map((s, i) => {
      const ex = existing[i].exists ? existing[i].data() : null;
      return {
        uid: s.uid, name: s.name || "(no name)",
        ca1: ex ? ex.ca1 : "", ca2: ex ? ex.ca2 : "", exam: ex ? ex.exam : "",
        locked: ex ? (ex.status === "generated") : false
      };
    });

    renderTeacherResultsTable(cls, subject, term, session);
  } catch(e){
    area.innerHTML = `<div class="field-error">Error loading students: ${e.message}</div>`;
  }
}

function renderTeacherResultsTable(cls, subject, term, session){
  const area = document.getElementById("rResultsArea");
  const rows = currentResultsBatch.map((s, i) => `
    <div style="display:flex; align-items:center; gap:8px; border:1px solid var(--gray-line); border-radius:8px; padding:8px 10px; margin-bottom:6px; ${s.locked ? "opacity:0.55;" : ""}">
      <div style="flex:1; min-width:0; font-weight:600; overflow-wrap:anywhere;">${s.name}</div>
      <input type="number" min="0" max="20" placeholder="CA1" value="${s.ca1}" ${s.locked ? "disabled" : ""} style="width:56px;" onchange="currentResultsBatch[${i}].ca1=this.value">
      <input type="number" min="0" max="20" placeholder="CA2" value="${s.ca2}" ${s.locked ? "disabled" : ""} style="width:56px;" onchange="currentResultsBatch[${i}].ca2=this.value">
      <input type="number" min="0" max="60" placeholder="Exam" value="${s.exam}" ${s.locked ? "disabled" : ""} style="width:56px;" onchange="currentResultsBatch[${i}].exam=this.value">
    </div>
  `).join("");

  const anyLocked = currentResultsBatch.some(s => s.locked);

  area.innerHTML = `
    <div style="display:flex; gap:8px; font-size:12px; color:#666; padding:0 10px; margin-bottom:6px;">
      <div style="flex:1;">Student</div><div style="width:56px;">CA1/20</div><div style="width:56px;">CA2/20</div><div style="width:56px;">Exam/60</div>
    </div>
    ${rows}
    ${anyLocked ? `<div class="placeholder-note">Some results here have already been finalized by Admin and can no longer be edited by you.</div>` : ""}
    <button class="btn-primary" onclick="submitTeacherResults('${cls}','${subject}','${term}',${JSON.stringify(session)})">Submit for Approval</button>
  `;
}

async function submitTeacherResults(cls, subject, term, session){
  const errBox = document.getElementById("rError");
  errBox.textContent = "";

  const toSave = currentResultsBatch.filter(s => !s.locked);
  for(const s of toSave){
    if(s.ca1 === "" || s.ca2 === "" || s.exam === ""){
      errBox.textContent = `Please fill CA1, CA2, and Exam for ${s.name} (or leave the whole row untouched to skip).`;
      return;
    }
  }
  const filled = toSave.filter(s => s.ca1 !== "" && s.ca2 !== "" && s.exam !== "");
  if(filled.length === 0){
    errBox.textContent = "No scores entered.";
    return;
  }

  try{
    await Promise.all(filled.map(s => {
      const ca1 = Number(s.ca1), ca2 = Number(s.ca2), exam = Number(s.exam);
      const total = ca1 + ca2 + exam;
      const { grade, remark } = waecGrade(total);
      return db.collection("results").doc(resultDocId(s.uid, subject, term, session)).set({
        studentUid: s.uid, studentName: s.name, class: cls, level: currentProfile.level,
        subject, term, session, ca1, ca2, exam, total, grade, remark,
        status: "submitted", released: false, withheld: false,
        submittedBy: currentUser.uid, submittedAt: new Date().toISOString()
      }, { merge: true });
    }));
    document.getElementById("rResultsArea").innerHTML = `<div class="placeholder-note">Results submitted for approval. You can come back to edit them until Admin finalizes.</div>`;
  } catch(e){
    errBox.textContent = "Error submitting: " + e.message;
  }
}

async function loadResultsForApproval(){
  const errBox = document.getElementById("aError");

function renderApprovalResults(results, cls, subject, term, session){
  const area = document.getElementById("aResultsArea");

  if(results.length === 0){
    area.innerHTML = `<div class="placeholder-note">No submitted results yet for ${cls} · ${subject} · ${term} · ${session}.</div>`;
    return;
  }

  const submitted = results.filter(r => r.status === "submitted");
  const finalized = results.filter(r => r.status === "generated");

  const submittedRows = submitted.map(r => `
    <div style="display:flex; justify-content:space-between; align-items:center; border:1px solid var(--gray-line); border-radius:8px; padding:8px 10px; margin-bottom:6px;">
      <div>${r.studentName} — CA1:${r.ca1} CA2:${r.ca2} Exam:${r.exam} <strong>Total:${r.total} (${r.grade})</strong></div>
    </div>
  `).join("");

  const finalizedRows = finalized.map(r => `
    <div style="display:flex; justify-content:space-between; align-items:center; border:1px solid var(--gray-line); border-radius:8px; padding:8px 10px; margin-bottom:6px; gap:8px;">
      <div style="min-width:0;">
        <div>${r.studentName} — Total:${r.total} (${r.grade})</div>
        <div style="font-size:12px; color:${r.released ? "#1a7a1a" : "#b00020"};">${r.released ? "Released to student" : "Not yet released"}${r.withheld ? " · Withheld" : ""}</div>
      </div>
      <div style="display:flex; gap:6px; flex-shrink:0; align-items:center;">
        <label style="font-size:12px; display:flex; align-items:center; gap:4px;">
          <input type="checkbox" ${r.withheld ? "checked" : ""} onchange="toggleWithhold('${r.id}', this.checked)"> Withhold
        </label>
        <button class="btn-secondary" onclick="toggleRelease('${r.id}', ${!r.released})">${r.released ? "Unrelease" : "Release"}</button>
      </div>
    </div>
  `).join("");

  area.innerHTML = `
    ${submitted.length > 0 ? `
      <div class="section-title">Awaiting Generation (${submitted.length})</div>
      ${submittedRows}
      <button class="btn-primary" onclick="generateResults('${cls}','${subject}','${term}',${JSON.stringify(session)})">Generate Results</button>
    ` : ""}
    ${finalized.length > 0 ? `
      <div class="section-title" style="margin-top:16px;">Generated (${finalized.length})</div>
      ${finalizedRows}
      <button class="btn-primary" onclick="releaseAllResults('${cls}','${subject}','${term}',${JSON.stringify(session)})">Release All (except withheld)</button>
    ` : ""}
  `;
}

async function generateResults(cls, subject, term, session){
  try{
    const snap = await db.collection("results")
      .where("class","==",cls).where("subject","==",subject)
      .where("term","==",term).where("session","==",session)
      .where("status","==","submitted")
      .get();

    const batchDocs = [];
    snap.forEach(doc => batchDocs.push(doc.ref));

    await Promise.all(batchDocs.map(ref => ref.update({
      status: "generated",
      generatedBy: currentUser.uid,
      generatedAt: new Date().toISOString()
    })));

    loadResultsForApproval();
  } catch(e){
    document.getElementById("aError").textContent = "Error generating results: " + e.message;
  }
}

async function toggleWithhold(resultId, withheld){
  try{
    const updates = { withheld };
    if(withheld) updates.released = false;
    await db.collection("results").doc(resultId).update(updates);
    loadResultsForApproval();
  } catch(e){
    alert("Error updating: " + e.message);
  }
}

async function toggleRelease(resultId, releasedValue){
  try{
    await db.collection("results").doc(resultId).update({
      released: releasedValue,
      releasedBy: currentUser.uid,
      releasedAt: new Date().toISOString()
    });
    loadResultsForApproval();
  } catch(e){
    alert("Error updating: " + e.message);
  }
}

async function releaseAllResults(cls, subject, term, session){
  try{
    const snap = await db.collection("results")
      .where("class","==",cls).where("subject","==",subject)
      .where("term","==",term).where("session","==",session)
      .where("status","==","generated").where("withheld","==",false)
      .get();

    const refs = [];
    snap.forEach(doc => refs.push(doc.ref));

    await Promise.all(refs.map(ref => ref.update({
      released: true, releasedBy: currentUser.uid, releasedAt: new Date().toISOString()
    })));

    loadResultsForApproval();
  } catch(e){
    document.getElementById("aError").textContent = "Error releasing results: " + e.message;
  }
}

/* ============================================================
   FEE RECORDS
   Cashier records payments (atomic increments to avoid concurrent-write loss).
   Admin (level or general) can view/edit the same way.
   Student sees own balance only, read-only.
   Fee doc id: `${studentUid}_${term}_${session}` (deterministic upsert)
============================================================ */
function classListForLevel(level){
  if(level === "primary") return PRIMARY_CLASSES;
  if(level === "secondary") return SECONDARY_CLASSES;
  return [...PRIMARY_CLASSES, ...SECONDARY_CLASSES];
}

function feeDocId(studentUid, term, session){
  const clean = s => String(s).trim().replace(/[^a-zA-Z0-9]+/g, "_");
  return `${studentUid}_${clean(term)}_${clean(session)}`;
}

function openFeeManager(context){
  feeManagerContext = context;
  const main = document.getElementById("mainContent");
  const classList = context === "cashier" ? classListForLevel(currentProfile.level) : classListForLevel(context);

  main.innerHTML = `
    <button class="btn-secondary" onclick="renderDashboard()">&larr; Back to Dashboard</button>
    <div class="section-title" style="margin-top:12px;">Fee Records</div>
    <div class="form-group">
      <label>Class</label>
      <select id="fClass">${classList.map(c => `<option value="${c}">${c}</option>`).join("")}</select>
    </div>
    <div class="form-group">
      <label>Term</label>
      <select id="fTerm">${termOptionsHTML()}</select>
    </div>
    <div class="form-group">
      <label>Session</label>
      <input type="text" id="fSession" placeholder="e.g. 2025/2026" value="${defaultSession}">
    </div>
    <button class="btn-primary" onclick="loadFeeRecords()">Load Students</button>
    <div class="field-error" id="fError"></div>
    <div id="fResultsArea" style="margin-top:16px;"></div>
  `;
}

async function loadFeeRecords(){
  const errBox = document.getElementById("fError");
  errBox.textContent = "";
  const cls = document.getElementById("fClass").value;
  const term = document.getElementById("fTerm").value;
  const session = document.getElementById("fSession").value.trim();

  if(!session){
    errBox.textContent = "Please enter the session (e.g. 2025/2026).";
    return;
  }

  const area = document.getElementById("fResultsArea");
  area.innerHTML = `<div class="placeholder-note">Loading students...</div>`;

  try{
    const snap = await db.collection("users").where("role","==","student").where("class","==",cls).get();
    let students = [];
    snap.forEach(doc => students.push({ uid: doc.id, ...doc.data() }));
    students.sort((a,b) => (a.name || "").localeCompare(b.name || ""));

    if(students.length === 0){
      area.innerHTML = `<div class="placeholder-note">No students found in ${cls}.</div>`;
      currentFeeBatch = [];
      return;
    }

    const level = PRIMARY_CLASSES.includes(cls) ? "primary" : "secondary";
    const feeSnaps = await Promise.all(students.map(s =>
      db.collection("fees").doc(feeDocId(s.uid, term, session)).get()
    ));

    currentFeeBatch = students.map((s, i) => {
      const fd = feeSnaps[i].exists ? feeSnaps[i].data() : null;
      return {
        uid: s.uid, name: s.name || "(no name)", class: cls, level,
        totalFee: fd ? (fd.totalFee || 0) : 0,
        amountPaid: fd ? (fd.amountPaid || 0) : 0
      };
    });

    renderFeeTable(cls, term, session);
  } catch(e){
    area.innerHTML = `<div class="field-error">Error loading students: ${e.message}</div>`;
  }
}

function renderFeeTable(cls, term, session){
  const area = document.getElementById("fResultsArea");
  const rows = currentFeeBatch.map((s, i) => {
    const balance = s.totalFee - s.amountPaid;
    return `
      <div style="border:1px solid var(--gray-line); border-radius:8px; padding:10px; margin-bottom:8px;">
        <div style="font-weight:600; margin-bottom:6px; overflow-wrap:anywhere;">${s.name}</div>
        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
          <label style="font-size:12px;">Total Fee ₦
            <input type="number" min="0" value="${s.totalFee}" style="width:90px;"
              onchange="setTotalFee(${i}, this.value, '${cls}', '${term}', ${JSON.stringify(session)})">
          </label>
          <span style="font-size:12px;">Paid: ₦${s.amountPaid}</span>
          <span style="font-size:12px; font-weight:700; color:${balance > 0 ? "#b00020" : "#1a7a1a"};">Balance: ₦${balance}</span>
        </div>
        <div style="display:flex; gap:6px; align-items:center; margin-top:8px;">
          <input type="number" min="1" placeholder="Add payment ₦" id="pay_${i}" style="width:130px;">
          <button class="btn-secondary" onclick="addPayment(${i}, '${cls}', '${term}', ${JSON.stringify(session)})">Add Payment</button>
        </div>
      </div>
    `;
  }).join("");

  area.innerHTML = `
    <button class="btn-secondary" onclick="printFeeList('${cls}','${term}',${JSON.stringify(session)})">🖨️ Print Fee List</button>
    <div style="margin-top:10px;">${rows}</div>
  `;
}

async function printFeeList(cls, term, session){
  const printArea = document.getElementById("printArea");
  const rows = currentFeeBatch.map(s => {
    const balance = s.totalFee - s.amountPaid;
    return `<tr><td>${s.name}</td><td>₦${s.totalFee}</td><td>₦${s.amountPaid}</td><td>₦${balance}</td></tr>`;
  }).join("");
  const totalOutstanding = currentFeeBatch.reduce((sum, s) => sum + (s.totalFee - s.amountPaid), 0);

  printArea.innerHTML = `
    <div style="text-align:center; margin-bottom:14px;">
      <h2 style="margin:0;">Faith International School, Itobe</h2>
      <div style="font-style:italic;">"In God We Trust"</div>
      <div style="margin-top:8px; font-weight:600;">Fee Record — ${cls} · ${term} · ${session}</div>
      <div style="font-size:12px; color:#555;">Printed: ${new Date().toLocaleDateString()}</div>
    </div>
    <table>
      <thead><tr><th>Name</th><th>Total Fee</th><th>Paid</th><th>Balance</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div style="margin-top:12px; font-weight:700;">Total Outstanding: ₦${totalOutstanding}</div>
  `;

  document.body.classList.add("printing");
  window.print();
}

window.addEventListener("afterprint", () => {
  document.body.classList.remove("printing");
});

async function setTotalFee(i, value, cls, term, session){
  const s = currentFeeBatch[i];
  const totalFee = Number(value) || 0;
  s.totalFee = totalFee;
  try{
    await db.collection("fees").doc(feeDocId(s.uid, term, session)).set({
      studentUid: s.uid, studentName: s.name, class: cls, level: s.level, term, session,
      totalFee, updatedAt: new Date().toISOString(), updatedBy: currentUser.uid
    }, { merge: true });
    renderFeeTable(cls, term, session);
  } catch(e){
    alert("Error saving total fee: " + e.message);
  }
}

async function addPayment(i, cls, term, session){
  const input = document.getElementById(`pay_${i}`);
  const amount = Number(input.value);
  if(!amount || amount <= 0){
    alert("Enter a valid payment amount.");
    return;
  }
  const s = currentFeeBatch[i];
  try{
    // Atomic increment avoids losing payments if two cashiers record at once.
    await db.collection("fees").doc(feeDocId(s.uid, term, session)).set({
      studentUid: s.uid, studentName: s.name, class: cls, level: s.level, term, session,
      amountPaid: firebase.firestore.FieldValue.increment(amount),
      updatedAt: new Date().toISOString(), updatedBy: currentUser.uid
    }, { merge: true });

    s.amountPaid += amount;
    renderFeeTable(cls, term, session);
  } catch(e){
    alert("Error recording payment: " + e.message);
  }
}

/* ============================================================
   ANNOUNCEMENTS
   Admins only can post (General Admin can target either level or both;
   Level Admins are locked to their own level). Everyone can view,
   filtered to announcements matching their level (or "both").
============================================================ */
function openAnnouncements(context){
  const main = document.getElementById("mainContent");
  const isAdmin = ["general_admin","primary_admin","secondary_admin"].includes(currentProfile.role);
  const isGeneralAdmin = currentProfile.role === "general_admin";

  main.innerHTML = `
    <button class="btn-secondary" onclick="renderDashboard()">&larr; Back to Dashboard</button>
    <div class="section-title" style="margin-top:12px;">Announcements</div>
    ${isAdmin ? `
      <div class="form-group">
        <label>Title</label>
        <input type="text" id="annTitle" placeholder="e.g. Mid-Term Break Notice">
      </div>
      <div class="form-group">
        <label>Message</label>
        <textarea id="annBody" rows="4" style="width:100%; padding:8px; border:1px solid var(--gray-line); border-radius:8px; box-sizing:border-box;" placeholder="Write the announcement..."></textarea>
      </div>
      <div class="form-group">
        <label>Audience</label>
        ${isGeneralAdmin ? `
          <select id="annLevel">
            <option value="both">Both Levels</option>
            <option value="primary">Primary Only</option>
            <option value="secondary">Secondary Only</option>
          </select>
        ` : `<input type="text" value="${currentProfile.level === "primary" ? "Primary Only" : "Secondary Only"}" disabled>
          <input type="hidden" id="annLevel" value="${currentProfile.level}">`}
      </div>
      <div class="field-error" id="annError"></div>
      <button class="btn-primary" onclick="postAnnouncement()">Post Announcement</button>
      <div class="section-title" style="margin-top:20px;">Posted Announcements</div>
    ` : ""}
    <div id="annListArea"><div class="placeholder-note">Loading...</div></div>
  `;

  loadAnnouncements();
}

async function loadAnnouncements(){
  const area = document.getElementById("annListArea");
  try{
    const snap = await db.collection("announcements").orderBy("postedAt","desc").limit(50).get();
    let anns = [];
    snap.forEach(doc => anns.push({ id: doc.id, ...doc.data() }));

    const isGeneralAdmin = currentProfile.role === "general_admin";
    if(!isGeneralAdmin){
      const myLevel = currentProfile.level;
      anns = anns.filter(a => a.level === "both" || a.level === myLevel);
    }

    if(anns.length === 0){
      area.innerHTML = `<div class="placeholder-note">No announcements yet.</div>`;
      return;
    }

    const isAdmin = ["general_admin","primary_admin","secondary_admin"].includes(currentProfile.role);
    const levelLabel = l => l === "both" ? "Both Levels" : l.charAt(0).toUpperCase() + l.slice(1);

    area.innerHTML = anns.map(a => `
      <div style="border:1px solid var(--gray-line); border-radius:8px; padding:10px 12px; margin-bottom:8px;">
        <div style="display:flex; justify-content:space-between; align-items:start; gap:8px;">
          <div style="font-weight:700; overflow-wrap:anywhere;">${a.title}</div>
          ${isAdmin ? `<button class="btn-secondary" style="color:#b00020; flex-shrink:0;" onclick="deleteAnnouncement('${a.id}')">Delete</button>` : ""}
        </div>
        <div style="font-size:12px; color:#666; margin:4px 0;">${levelLabel(a.level)} · ${a.postedAt ? new Date(a.postedAt).toLocaleDateString() : ""}</div>
        <div style="white-space:pre-wrap; overflow-wrap:anywhere;">${a.body}</div>
      </div>
    `).join("");
  } catch(e){
    area.innerHTML = `<div class="field-error">Error loading announcements: ${e.message}</div>`;
  }
}

async function postAnnouncement(){
  const errBox = document.getElementById("annError");
  errBox.textContent = "";
  const title = document.getElementById("annTitle").value.trim();
  const body = document.getElementById("annBody").value.trim();
  const level = document.getElementById("annLevel").value;

  if(!title || !body){
    errBox.textContent = "Please fill in both title and message.";
    return;
  }

  try{
    await db.collection("announcements").add({
      title, body, level,
      postedBy: currentUser.uid, postedByName: currentProfile.name || "",
      postedAt: new Date().toISOString()
    });
    document.getElementById("annTitle").value = "";
    document.getElementById("annBody").value = "";
    loadAnnouncements();
  } catch(e){
    errBox.textContent = "Error posting: " + e.message;
  }
}

async function deleteAnnouncement(id){
  if(!confirm("Delete this announcement? This cannot be undone.")) return;
  try{
    await db.collection("announcements").doc(id).delete();
    loadAnnouncements();
  } catch(e){
    alert("Error deleting: " + e.message);
  }
}

   CROSS-LEVEL REPORTS — General Admin only. Pass/fail summary
   across Primary and Secondary for a chosen term/session.
   "Pass" = any grade above F9 (i.e. total score of 40% or higher).
============================================================ */
function openCrossLevelReports(){
  const main = document.getElementById("mainContent");
  main.innerHTML = `
    <button class="btn-secondary" onclick="renderDashboard()">&larr; Back to Dashboard</button>
    <div class="section-title" style="margin-top:12px;">Cross-Level Reports</div>
    <div class="form-group">
      <label>Term</label>
      <select id="clrTerm">${termOptionsHTML()}</select>
    </div>
    <div class="form-group">
      <label>Session</label>
      <input type="text" id="clrSession" placeholder="e.g. 2025/2026" value="${defaultSession}">
    </div>
    <button class="btn-primary" onclick="loadCrossLevelReport()">Generate Report</button>
    <div class="field-error" id="clrError"></div>
    <div id="clrArea" style="margin-top:16px;"></div>
  `;
}

async function loadCrossLevelReport(){
  const errBox = document.getElementById("clrError");
  errBox.textContent = "";
  const term = document.getElementById("clrTerm").value;
  const session = document.getElementById("clrSession").value.trim();

  if(!session){
    errBox.textContent = "Please enter the session (e.g. 2025/2026).";
    return;
  }

  const area = document.getElementById("clrArea");
  area.innerHTML = `<div class="placeholder-note">Loading...</div>`;

  try{
    const snap = await db.collection("results").where("term","==",term).where("session","==",session).get();
    let results = [];
    snap.forEach(doc => results.push(doc.data()));

    if(results.length === 0){
      area.innerHTML = `<div class="placeholder-note">No results found for ${term} · ${session}.</div>`;
      return;
    }

    const summarize = (list) => {
      const total = list.length;
      const pass = list.filter(r => r.grade !== "F9").length;
      const fail = total - pass;
      const rate = total ? ((pass / total) * 100).toFixed(1) : "0.0";
      return { total, pass, fail, rate };
    };

    const overall = summarize(results);
    const primary = summarize(results.filter(r => r.level === "primary"));
    const secondary = summarize(results.filter(r => r.level === "secondary"));

    const rowHTML = (label, s) => `
      <div style="border:1px solid var(--gray-line); border-radius:8px; padding:10px 12px; margin-bottom:8px;">
        <div style="font-weight:700;">${label}</div>
        <div style="font-size:13px;">Total Entries: ${s.total} · Pass: ${s.pass} · Fail: ${s.fail}</div>
        <div style="font-weight:700; color:${Number(s.rate) >= 50 ? "#1a7a1a" : "#b00020"};">Pass Rate: ${s.rate}%</div>
      </div>
    `;

    area.innerHTML = `
      ${rowHTML("Overall (Both Levels)", overall)}
      ${rowHTML("Primary", primary)}
      ${rowHTML("Secondary", secondary)}
      <div class="placeholder-note">Pass = any grade above F9 (total score of 40% or higher). Includes all submitted results regardless of release status.</div>
    `;
  } catch(e){
    area.innerHTML = `<div class="field-error">Error loading report: ${e.message}</div>`;
  }
}

   of Users, Results, Fees, Announcements, and Settings straight to
   the phone. Works entirely in-browser, no extra tools needed.
============================================================ */
function openExportData(){
  const main = document.getElementById("mainContent");
  main.innerHTML = `
    <button class="btn-secondary" onclick="renderDashboard()">&larr; Back to Dashboard</button>
    <div class="section-title" style="margin-top:12px;">Export Data</div>
    <div class="placeholder-note">Downloads a full backup of Users, Results, Fees, Announcements, and Settings as a single JSON file to your phone. Keep this somewhere safe (e.g. Google Drive) — it's your recovery copy if anything is ever accidentally deleted.</div>
    <button class="btn-primary" id="exportBtn" onclick="exportPortalData()">Download Backup</button>
    <div class="placeholder-note" id="exportStatus"></div>
  `;
}

async function exportPortalData(){
  const status = document.getElementById("exportStatus");
  status.textContent = "Exporting... this may take a moment.";

  try{
    const collections = ["users","results","fees","announcements","settings"];
    const backup = {};

    for(const col of collections){
      const snap = await db.collection(col).get();
      backup[col] = [];
      snap.forEach(doc => backup[col].push({ id: doc.id, ...doc.data() }));
    }

    backup._exportedAt = new Date().toISOString();
    backup._school = "Faith International School, Itobe — fiss-itobe-portal";

    const json = JSON.stringify(backup, null, 2);
    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const dateStr = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `fiss-itobe-portal-backup-${dateStr}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    status.textContent = "Backup downloaded. Check your phone's Downloads folder.";
  } catch(e){
    status.textContent = "Error exporting: " + e.message;
  }
}

function validateTeacherClasses(){

  const checked = [...grid.querySelectorAll("input:checked")];
  const levels = new Set(checked.map(c => c.dataset.level));
  const errBox = document.getElementById("accError");
  if(levels.size > 1){
    errBox.textContent = "A teacher account must be assigned within one level only. Create a separate account for the other level.";
  } else {

  }
}

function generatePassword(){
  const chars = "ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789";
  let pass = "";
  for(let i = 0; i < 8; i++){
    pass += chars.charAt(Math.floor(Math.random() * chars.length));
  }
  return pass;
}

      errBox.textContent = "Please select a class.";
      return;
    }
    level = PRIMARY_CLASSES.includes(classAssigned) ? "primary" : "secondary";
  } else if(role === "teacher"){
    const grid = document.getElementById("teacherClassGrid");
    const checked = [...grid.querySelectorAll("input:checked")];
    if(checked.length === 0){
      errBox.textContent = "Please select at least one class.";
      return;
    }
    const levels = new Set(checked.map(c => c.dataset.level));
    if(levels.size > 1){
      errBox.textContent = "A teacher account must be assigned within one level only.";
      return;
    }
    classAssigned = checked.map(c => c.value);
    level = [...levels][0];

    const subjectGrid = document.getElementById("teacherSubjectGrid");
    const checkedSubjects = [...subjectGrid.querySelectorAll("input:checked")];
    if(checkedSubjects.length === 0){
      errBox.textContent = "Please select at least one subject.";
      return;
    }
    subjectsAssigned = checkedSubjects.map(s => s.value);
  } else if(role === "cashier"){
    const levelField = document.getElementById("accLevel");
    level = levelField.value;
  } else if(role === "primary_admin"){
    level = "primary";
  } else if(role === "secondary_admin"){
    level = "secondary";
  } else if(role === "general_admin"){
    level = "both";
  }

  try{
    // Create the auth account using the SECONDARY app instance,
    // so the current admin's own session is untouched.
    const cred = await secondaryAuth.createUserWithEmailAndPassword(email, password);
    const uid = cred.user.uid;
    await secondaryAuth.signOut();

    const profileData = {
      name: name,
      email: email,
      role: role,
      level: level,
      createdAt: new Date().toISOString(),
      createdBy: currentUser.uid
    };
    if(classAssigned) profileData.class = classAssigned;
    if(subjectsAssigned) profileData.subjects = subjectsAssigned;

    await db.collection("users").doc(uid).set(profileData);

    showCredentials({ name, email, password, role, level, classAssigned, subjectsAssigned });
    closeAccountModal();
  } catch(e){
    errBox.textContent = "Error: " + e.message;
  }
}

function showCredentials(data){
  const panel = document.getElementById("credentialsPanel");
  const body = document.getElementById("credentialsBody");
  body.innerHTML = `
    <div class="cred-row"><span class="k">Name</span><span class="v">${data.name}</span></div>
    <div class="cred-row"><span class="k">${data.role === "student" ? "Username" : "Email"}</span><span class="v">${data.email}</span></div>
    <div class="cred-row"><span class="k">Password</span><span class="v">${data.password}</span></div>
    <div class="cred-row"><span class="k">Role</span><span class="v">${roleLabel(data.role)}</span></div>
    ${data.classAssigned ? `<div class="cred-row"><span class="k">Class</span><span class="v">${Array.isArray(data.classAssigned) ? data.classAssigned.join(", ") : data.classAssigned}</span></div>` : ""}
    ${data.subjectsAssigned ? `<div class="cred-row"><span class="k">Subjects</span><span class="v">${data.subjectsAssigned.join(", ")}</span></div>` : ""}
    <div class="cred-warning">Save or share these credentials now — the password cannot be retrieved again later. This account will log straight into its assigned dashboard.</div>
  `;
  panel.classList.remove("hidden");
}

function closeCredentialsPanel(){
  document.getElementById("credentialsPanel").classList.add("hidden");
  renderDashboard(); // refresh underlying dashboard
}
</script>
</body>
</html>
